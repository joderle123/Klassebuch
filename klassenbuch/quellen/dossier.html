      '<div class="field">' +
        '<label class="checkbox-row"><input type="radio" name="import-mode" value="merge" checked> <span><strong>Zusammenführen</strong> — neue Datensätze ergänzen, gleiche IDs werden überschrieben, bestehende Daten bleiben sonst erhalten.</span></label>' +
        '<label class="checkbox-row"><input type="radio" name="import-mode" value="replace"> <span><strong>Ersetzen</strong> — die komplette aktuelle Datenbank wird durch den Inhalt dieser Datei ersetzt. Nicht rückgängig zu machen!</span></label>' +
      '</div>' +
      '<div class="page-head" style="margin:0;">' +
        '<button type="button" class="btn" id="bk-cancel-import">Abbrechen</button>' +
        '<button type="button" class="btn btn-primary" id="bk-confirm-import">Import durchführen</button>' +
      '</div>' +
    '</div>';
  }

  var html =
    '<div class="page-head"><div><h2>Backup</h2><p class="muted">Sicherung &amp; Geräteübertrag im Team — als JSON-Datei, komplett lokal.</p></div></div>' +
    '<div class="card export-config">' +
      '<h3 style="margin-top:0;">Backup exportieren</h3>' +
      '<div id="bk-summary">' + summaryHtml() + '</div>' +
      '<button type="button" class="btn btn-primary" id="bk-export">Backup als .json herunterladen</button>' +
    '</div>' +
    '<div class="card export-config" style="margin-top:14px;">' +
      '<h3 style="margin-top:0;">Backup importieren</h3>' +
      '<p class="muted">Wählen Sie eine zuvor exportierte <span class="kbd">.json</span>-Datei. Sie können danach wählen, ob die Daten zusammengeführt oder die Datenbank komplett ersetzt werden soll.</p>' +
      '<input type="file" id="bk-file" accept="application/json,.json">' +
    '</div>' +
    '<div id="bk-import-panel">' + importPanelHtml() + '</div>';

  return {
    navKey: 'backup',
    html: html,
    afterRender: function (root) {
      qs('#bk-export', root).addEventListener('click', function () {
        var data = Repo.exportAll();
        var filename = 'dossier-backup_' + nowIso().slice(0, 10) + '.json';
        downloadBlob(filename, JSON.stringify(data, null, 2), 'application/json');
        showToast('Backup wird heruntergeladen: ' + filename);
      });

      var fileInput = qs('#bk-file', root);
      var importPanel = qs('#bk-import-panel', root);

      fileInput.addEventListener('change', function () {
        var file = fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(reader.result);
            if (!data || !Array.isArray(data.students) || !Array.isArray(data.entries)) {
              showToast('Diese Datei sieht nicht wie ein gültiges Dossier-Backup aus.', { error: true });
              return;
            }
            pendingImport = { data: data, filename: file.name };
            importPanel.innerHTML = importPanelHtml();
            wireImportPanel();
            importPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } catch (e) {
            showToast('Datei konnte nicht gelesen werden: ' + e.message, { error: true });
          }
        };
        reader.readAsText(file);
      });

      function wireImportPanel() {
        var cancelBtn = qs('#bk-cancel-import', importPanel);
        var confirmBtn = qs('#bk-confirm-import', importPanel);
        if (cancelBtn) cancelBtn.addEventListener('click', function () {
          pendingImport = null;
          fileInput.value = '';
          importPanel.innerHTML = '';
        });
        if (confirmBtn) confirmBtn.addEventListener('click', function () {
          var mode = (qs('input[name="import-mode"]:checked', importPanel) || {}).value || 'merge';
          if (mode === 'replace' && !confirm('Wirklich die GESAMTE aktuelle Datenbank durch diese Datei ersetzen? Das kann nicht rückgängig gemacht werden.')) return;
          Repo.importAll(pendingImport.data, mode).then(function () {
            showToast('Import abgeschlossen (' + (mode === 'replace' ? 'ersetzt' : 'zusammengeführt') + ').');
            pendingImport = null;
            fileInput.value = '';
            navigate('#/backup', true);
          }).catch(function (err) {
            showToast('Import fehlgeschlagen: ' + err.message, { error: true });
          });
        });
      }
    }
  };
}


'use strict';

/* ============================================================
   Ansicht — Themen-Analyse
   Macht automatisch erkannte Themen (lexikalische Schlagwort-
   Treffer, kein manuelles Tagging nötig) sichtbar:
   - quantitativ: Häufigkeits-Balken + Wochen-Heatmap
   - qualitativ: Stufen-Markierung + Original-Belege pro Thema
   ============================================================ */

function viewThemeAnalysis(params, query) {
  var students = Repo.listStudents();

  var state = {
    studentId: query.student || '',
    from: query.from || '',
    to: query.to || '',
    selectedTheme: query.theme || ''
  };

  function filteredEntries() {
    return Repo.listEntries().filter(function (e) {
      if (state.studentId && e.studentId !== state.studentId) return false;
      if (state.from && e.date < state.from) return false;
      if (state.to && e.date > state.to) return false;
      return true;
    });
  }

  function controlsHtml() {
    return '<div class="card export-config no-print" style="margin-bottom:18px;">' +
      '<div class="row">' +
        '<div class="field"><label for="th-student">Schüler</label>' +
          '<select id="th-student"><option value="">Alle Schüler</option>' + optionsHtml(students.map(function (s) { return { value: s.id, label: s.name }; }), state.studentId) + '</select></div>' +
        '<div class="field"><label for="th-from">Zeitraum von</label><input type="date" id="th-from" value="' + escapeAttr(state.from) + '"></div>' +
        '<div class="field"><label for="th-to">Zeitraum bis</label><input type="date" id="th-to" value="' + escapeAttr(state.to) + '"></div>' +
      '</div>' +
      '<div class="legend-row">' +
        [3, 2, 1].map(function (sev) {
          return '<span class="legend-item"><span class="legend-dot" style="background:' + SEVERITY_META[sev].color + '"></span>' + escapeHtml(SEVERITY_META[sev].label) + '</span>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  function barsHtml(aggList, entryTotal) {
    if (!aggList.length) return '<div class="empty-state">Keine Themen-Treffer im gewählten Bereich.</div>';
    var maxCount = aggList[0] ? Math.max.apply(null, aggList.map(function (a) { return a.entryCount; })) : 1;
    return '<div class="theme-bars">' + aggList.map(function (a) {
      var pct = Math.max(3, Math.round(100 * a.entryCount / maxCount));
      var selected = state.selectedTheme === a.key;
      var studentCount = Object.keys(a.students).length;
      return '<button type="button" class="theme-bar-row' + (selected ? ' selected' : '') + '" data-theme="' + escapeAttr(a.key) + '">' +
        '<span class="theme-bar-label">' + escapeHtml(a.key) + '</span>' +
        '<span class="theme-bar-track"><span class="theme-bar-fill" style="width:' + pct + '%; background:' + SEVERITY_META[a.severity].color + '"></span></span>' +
        '<span class="theme-bar-count">' + a.entryCount + '/' + entryTotal + ' Einträge · ' + a.matchCount + ' Treffer · ' + pluralize(studentCount, 'Schüler', 'Schüler') + '</span>' +
      '</button>';
    }).join('') + '</div>';
  }

  function heatmapHtml(aggList, entries) {
    if (!aggList.length) return '';
    var weekSet = {};
    entries.forEach(function (e) { weekSet[e.date] = true; });
    var weeks = Object.keys(weekSet).sort();
    if (weeks.length < 2) return '';
    var topThemes = aggList.slice(0, 14);
    var maxCell = 1;
    topThemes.forEach(function (a) { weeks.forEach(function (w) { if ((a.weeks[w] || 0) > maxCell) maxCell = a.weeks[w]; }); });

    var head = '<tr><th></th>' + weeks.map(function (w) { return '<th>' + escapeHtml(formatDateShort(w)) + '</th>'; }).join('') + '</tr>';
    var rows = topThemes.map(function (a) {
      var cells = weeks.map(function (w) {
        var c = a.weeks[w] || 0;
        if (!c) return '<td></td>';
        var alpha = 0.18 + 0.82 * (c / maxCell);
        return '<td><span class="heat-cell" style="background:' + SEVERITY_META[a.severity].color + '; opacity:' + alpha.toFixed(2) + '" title="' + escapeAttr(a.key + ' — ' + formatDate(w) + ': ' + c + ' Treffer') + '">' + c + '</span></td>';
      }).join('');
      return '<tr><th class="heat-theme' + (state.selectedTheme === a.key ? ' selected' : '') + '" data-theme="' + escapeAttr(a.key) + '">' + escapeHtml(a.key) + '</th>' + cells + '</tr>';
    }).join('');

    return '<h3 class="section-title">Verlauf über die Wochen (Heatmap)</h3>' +
      '<div class="card" style="padding:14px; overflow-x:auto;">' +
        '<table class="heatmap-table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>' +
        '<p class="hint" style="margin:8px 0 0;">Zahl = Stichwort-Treffer in der Woche. Zeile anklicken, um die Belege unten zu sehen.</p>' +
      '</div>';
  }

  function evidenceHtml(agg) {
    if (!state.selectedTheme) {
      return '<div class="empty-state">Thema oben anklicken, um die Original-Textstellen (Belege) zu sehen.</div>';
    }
    var a = agg[state.selectedTheme];
    if (!a) return '<div class="empty-state">Keine Belege für „' + escapeHtml(state.selectedTheme) + '" im gewählten Bereich.</div>';
    var items = a.evidence.slice().sort(function (x, y) { return x.date < y.date ? -1 : (x.date > y.date ? 1 : 0); });
    return '<div class="search-results">' + items.map(function (ev) {
      var student = Repo.getStudent(ev.studentId);
      var snippetHtml = escapeHtml(ev.snippet);
      ev.terms.forEach(function (t) {
        try {
          var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
          snippetHtml = snippetHtml.replace(re, '<mark class="theme-mark sev-' + a.severity + '">$1</mark>');
        } catch (err) { /* Tooltip-Hervorhebung ist optional */ }
      });
      return '<article class="card search-result" data-route="#/student/' + ev.studentId + '/entry/' + ev.entryId + '">' +
        '<div class="meta"><strong>' + escapeHtml(student ? student.name : ev.studentId) + '</strong><span>' + escapeHtml(formatDate(ev.date)) + '</span>' +
          '<span class="muted">Treffer: ' + escapeHtml(ev.terms.join(', ')) + '</span></div>' +
        '<div class="snippet">' + snippetHtml + '</div>' +
      '</article>';
    }).join('') + '</div>';
  }

  function bodyHtml() {
    var entries = filteredEntries();
    var agg = analyzeEntries(entries);
    var aggList = sortedThemeAggregates(agg);
    return '<h3 class="section-title">Häufigkeit (' + pluralize(entries.length, 'Eintrag', 'Einträge') + ' im gewählten Bereich)</h3>' +
      barsHtml(aggList, entries.length) +
      heatmapHtml(aggList, entries) +
      '<h3 class="section-title">Belege' + (state.selectedTheme ? ': ' + escapeHtml(state.selectedTheme) : '') + '</h3>' +
      evidenceHtml(agg);
  }

  var html =
    '<div class="page-head"><div><h2>Themen-Analyse</h2>' +
      '<p class="muted">Automatisch erkannte Themen aus allen Eintragstexten — ohne dass Tags gesetzt sein müssen.</p></div></div>' +
    '<div class="warn-banner" style="background:#eef3f7; border-color:#c6d6e3; color:#2a4257;">' +
      'Diese Analyse ist eine rein <strong>lexikalische Stichwort-Zählung</strong> als Lese- und Suchhilfe. ' +
      'Sie ist keine fachliche Bewertung, Diagnose oder Alarmierung — die Einschätzung bleibt beim Team.' +
    '</div>' +
    controlsHtml() +
    '<div id="th-body">' + bodyHtml() + '</div>';

  return {
    navKey: 'themes',
    html: html,
    afterRender: function (root) {
      var body = qs('#th-body', root);
      function rerender() { body.innerHTML = bodyHtml(); wireBody(); }

      qs('#th-student', root).addEventListener('change', function (e) { state.studentId = e.target.value; rerender(); });
      qs('#th-from', root).addEventListener('change', function (e) { state.from = e.target.value; rerender(); });
      qs('#th-to', root).addEventListener('change', function (e) { state.to = e.target.value; rerender(); });

      function wireBody() {
        qsa('[data-theme]', body).forEach(function (el) {
          el.addEventListener('click', function () {
            var key = el.getAttribute('data-theme');
            state.selectedTheme = state.selectedTheme === key ? '' : key;
            rerender();
          });
        });
      }
      wireBody();

      if (state.selectedTheme) {
        var sel = qs('.theme-bar-row.selected', body);
        if (sel) sel.scrollIntoView({ block: 'center' });
      }
    }
  };
}


'use strict';

/* ============================================================
   Ansicht — Réunion (Méindes-Teamversammlung)
   Alles op ee Bléck: Orga-Punkte uewen, duerno d'Schüler an
   hirer Reiefolleg — mat dem Réunions-Update, Ziler an den
   automatesch erkannten Themen. Ee Klick féiert an d'Dossier.
   ============================================================ */

/* Nächster Montag (heute, falls Montag) als ISO-Datum */
function nextMondayIso() {
  var d = new Date();
  var day = d.getDay(); // 0 = So, 1 = Mo
  var add = day === 1 ? 0 : ((8 - day) % 7);
  d.setDate(d.getDate() + add);
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + dd;
}

function viewReunion(params, query) {
  var reunions = Repo.listReunions(); // neueste zuerst
  var state = {
    date: query.date || (reunions[0] ? reunions[0].date : ''),
    q: '',
    filter: 'all',      // all | todo | update | noupdate | goals
    expanded: {},       // sid -> true
    orderEdit: false,
    extra: {}           // inaktiver Schueler -> in dieser Sitzung dazugeholt
  };

  function current() { return Repo.getReunionByDate(state.date); }
  function returnRoute() { return '#/reunion?date=' + encodeURIComponent(state.date); }

  /* ---- Ziele: sowohl alte String-Form als auch {text,done} unterstützen ---- */
  function normGoals(arr) {
    return (arr || []).map(function (g) {
      if (g && typeof g === 'object') return { text: String(g.text || ''), done: !!g.done };
      return { text: String(g), done: false };
    }).filter(function (g) { return g.text.trim(); });
  }
  function goalsFor(r, sid) { return normGoals(r.goals && r.goals[sid]); }
  function writeGoals(r, sid, goals) {
    if (!r.goals || typeof r.goals !== 'object') r.goals = {};
    r.goals[sid] = goals.map(function (g) { return { text: g.text, done: !!g.done }; });
  }
  function persist(r) {
    return Repo.saveReunion(r).catch(function (err) { showToast('Fehler beim Speichern: ' + err.message, { error: true }); });
  }

  /* ---- Datenzeilen (Reihenfolge der Versammlung + weitere aktive Schüler) ---- */
  /* Inaktive Schueler stehen NIE von allein in der Wochen-Réunion - auch dann
     nicht, wenn schon ein Update zu ihnen erfasst wurde. Sichtbar werden sie
     ausschliesslich, wenn man sie in der Leiste ueber der Liste anklickt;
     wer ein Update hat, traegt dort einen Punkt, damit nichts uebersehen
     wird. */
  function isExtra(sid) { return !!state.extra[sid]; }
  function inactiveStudents() {
    return Repo.listStudents().filter(function (s) { return s.active === false; });
  }
  function rowsFor(r) {
    var order = (r.studentOrder || []).slice();
    Repo.listStudents().forEach(function (s) {
      if (order.indexOf(s.id) !== -1) return;
      if (s.active !== false || isExtra(s.id)) order.push(s.id);
    });
    var discussed = r.discussed || [];
    var rows = [];
    order.forEach(function (sid) {
      var s = Repo.getStudent(sid);
      if (!s) return;
      var entry = Repo.reunionEntryFor(r.date, sid);
      if (s.active === false && !isExtra(sid)) return;
      var themes = entry ? analyzeText(entry.text) : [];
      var goals = goalsFor(r, sid);
      rows.push({
        sid: sid, s: s, entry: entry, themes: themes, goals: goals,
        hasUpdate: !!(entry && entry.text && entry.text.trim()),
        discussed: discussed.indexOf(sid) !== -1,
        openGoals: goals.filter(function (g) { return !g.done; }).length,
        risk: themes.some(function (t) { return t.severity === 3; })
      });
    });
    return rows;
  }
  function matchesFilter(row) {
    if (state.filter === 'todo') return !row.discussed;
    if (state.filter === 'update') return row.hasUpdate;
    if (state.filter === 'noupdate') return !row.hasUpdate;
    if (state.filter === 'goals') return row.openGoals > 0;
    return true;
  }
  function matchesSearch(row) {
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    if (row.s.name.toLowerCase().indexOf(q) !== -1) return true;
    if (row.entry && row.entry.text && row.entry.text.toLowerCase().indexOf(q) !== -1) return true;
    if (row.goals.some(function (g) { return g.text.toLowerCase().indexOf(q) !== -1; })) return true;
    return row.themes.some(function (t) { return t.key.toLowerCase().indexOf(q) !== -1; });
  }

  /* ---------- Kopfleiste (sticky) ---------- */
  function topbarHtml(r, rows) {
    var idx = reunions.map(function (x) { return x.date; }).indexOf(state.date);
    var newer = idx > 0 ? reunions[idx - 1] : null;   // jünger
    var older = idx >= 0 && idx < reunions.length - 1 ? reunions[idx + 1] : null;
    var nm = nextMondayIso();
    var hasNext = !!Repo.getReunionByDate(nm);
    var opts = reunions.map(function (x) { return { value: x.date, label: formatDate(x.date) + (x.date === nm ? ' · nächste' : '') }; });
    return '<div class="reu-topbar no-print">' +
      '<div class="reu-topbar-row">' +
        '<div class="reu-datewrap">' +
          '<button class="reu-navbtn" data-act="goreu" data-date="' + (older ? escapeAttr(older.date) : '') + '"' + (older ? '' : ' disabled') + ' title="ältere Réunion">‹</button>' +
          '<button class="reu-navbtn" data-act="goreu" data-date="' + (newer ? escapeAttr(newer.date) : '') + '"' + (newer ? '' : ' disabled') + ' title="jüngere Réunion">›</button>' +
        '</div>' +
        '<div class="reu-title"><span class="kick">Team-Réunion · Montags</span>' +
          '<select id="reu-date" aria-label="Réunion wählen">' + optionsHtml(opts, state.date) + '</select></div>' +
        '<div class="reu-actions">' +
          (hasNext
            ? '<button type="button" class="btn btn-sm" data-act="goreu" data-date="' + escapeAttr(nm) + '">Zur nächsten</button>'
            : '<button type="button" class="btn btn-sm btn-primary" id="reu-create-next">+ Nächste Réunion</button>') +
          (r ? '<button type="button" class="btn btn-sm" data-act="orderedit">' + (state.orderEdit ? '✓ Reihenfolge' : '↕ Reihenfolge') + '</button>' : '') +
          (r ? '<button type="button" class="btn btn-sm" data-act="print" title="Druckansicht — im Dialog „Als PDF speichern" wählen">🖨 PDF</button>' : '') +
          (r ? '<button type="button" class="btn btn-sm" data-act="word" title="Protokoll als Word-Datei speichern">⬇ Word</button>' : '') +
        '</div>' +
      '</div>' +
      (r ? statsHtml(r, rows) : '') +
    '</div>';
  }
  function statsHtml(r, rows) {
    var total = rows.length;
    var disc = rows.filter(function (x) { return x.discussed; }).length;
    var upd = rows.filter(function (x) { return x.hasUpdate; }).length;
    var openG = rows.reduce(function (n, x) { return n + x.openGoals; }, 0);
    var pct = total ? Math.round(disc / total * 100) : 0;
    function stat(cls, lab, val, sub, bar) {
      return '<div class="reu-stat ' + cls + '"><div class="lab">' + lab + '</div>' +
        '<div class="val">' + val + (sub ? ' <small>' + sub + '</small>' : '') + '</div>' +
        (bar != null ? '<div class="reu-bar"><span style="width:' + bar + '%"></span></div>' : '') + '</div>';
    }
    return '<div class="reu-stats" id="reu-stats">' +
      stat('good', 'Besprochen', disc + ' / ' + total, pct + ' %', pct) +
      stat('accent', 'Mit Update', upd + ' / ' + total, '', null) +
      stat('warn', 'Offene Ziele', String(openG), '', null) +
      stat('', 'Orga-Punkte', String((r.orgItems || []).length), '', null) +
    '</div>';
  }

  /* ---------- Filterleiste ---------- */
  function filterHtml(rows) {
    var counts = {
      all: rows.length,
      todo: rows.filter(function (x) { return !x.discussed; }).length,
      update: rows.filter(function (x) { return x.hasUpdate; }).length,
      noupdate: rows.filter(function (x) { return !x.hasUpdate; }).length,
      goals: rows.filter(function (x) { return x.openGoals > 0; }).length
    };
    var segs = [['all', 'Alle'], ['todo', 'Offen'], ['update', 'Mit Update'], ['noupdate', 'Ohne'], ['goals', 'Offene Ziele']];
    var anyExpanded = Object.keys(state.expanded).length > 0;
    return '<div class="reu-filter no-print">' +
      '<div class="reu-seg">' + segs.map(function (sg) {
        return '<button data-filter="' + sg[0] + '"' + (state.filter === sg[0] ? ' class="active"' : '') + '>' +
          sg[1] + '<span class="n">' + counts[sg[0]] + '</span></button>';
      }).join('') + '</div>' +
      '<button class="reu-collapse-all" data-act="collapseall">' + (anyExpanded ? 'Alle einklappen' : 'Alle ausklappen') + '</button>' +
      '<label class="reu-search"><input type="search" id="reu-q" placeholder="Suche Name, Text, Thema…" value="' + escapeAttr(state.q) + '"></label>' +
    '</div>';
  }

  /* ---------- Organisation ---------- */
  function orgHtml(r) {
    var items = r.orgItems || [];
    var group = (r.goals && r.goals.group) || [];
    var groupTxt = Array.isArray(group) ? group.join(' ') : String(group || '');
    var text = items.join('\n\n');
    return '<section class="card reu-orgcard">' +
      '<div class="reu-orgcard-head"><h3>Organisation</h3><span class="count" id="org-count">' + items.length + '</span><span class="sp"></span>' +
        '<span class="reu-saved" id="org-saved"></span></div>' +
      '<p class="hint">Direkt reinschreiben — wird automatisch gespeichert. Ein Orga-Punkt pro Absatz, eine Leerzeile trennt die Punkte.</p>' +
      '<textarea id="org-edit" class="reu-auto" rows="6" placeholder="Orga-Punkte der Réunion …">' + escapeHtml(text) + '</textarea>' +
      '<div class="field" style="margin-top:12px;"><label for="org-group">Gruppenziel der Woche</label>' +
        '<input type="text" id="org-group" value="' + escapeAttr(groupTxt) + '" placeholder="z. B. Wir schaffen ruhige Pausen."></div>' +
    '</section>';
  }

  /* ---------- Schüler-Karte ---------- */
  function cardHtml(row, i, total) {
    var expanded = !!state.expanded[row.sid], r = current();
    var themeChips = row.themes.slice(0, 3).map(function (t) {
      return '<span class="reu-minichip sev-' + t.severity + '">' + escapeHtml(t.key) + '</span>';
    }).join('');
    var goalNote = row.goals.length
      ? '<span class="reu-goalcount">' + (row.openGoals ? row.openGoals + ' offen' : 'Ziele ✓') + '</span>'
      : '';
    var ord = state.orderEdit
      ? '<div class="reu-ordbtns"><button data-act="up" data-sid="' + escapeAttr(row.sid) + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
        '<button data-act="down" data-sid="' + escapeAttr(row.sid) + '"' + (i === total - 1 ? ' disabled' : '') + '>▼</button></div>'
      : '<span class="reu-order">' + (i + 1) + '</span>';
    var head =
      '<div class="reu-row" data-act="toggle" data-sid="' + escapeAttr(row.sid) + '">' +
        '<button class="reu-check' + (row.discussed ? ' on' : '') + '" data-act="discuss" data-sid="' + escapeAttr(row.sid) + '" title="als besprochen markieren" aria-label="besprochen">✓</button>' +
        ord +
        '<div class="reu-idblock">' +
          '<div class="reu-nameline">' +
            '<a href="#/student/' + escapeAttr(row.sid) + '" class="reu-name" data-route="#/student/' + escapeAttr(row.sid) + '">' + escapeHtml(row.s.name) + '</a>' +
            (row.risk ? '<span class="reu-flag risk">Sorge</span>' : '') +
            '<span class="reu-flag ' + (row.hasUpdate ? 'upd' : 'noupd') + '">' + (row.hasUpdate ? 'Update' : 'kein Update') + '</span>' +
          '</div>' +
          '<div class="reu-metaline">' +
            (themeChips ? '<span class="reu-minichips">' + themeChips + '</span>' : '') +
            (goalNote || (!themeChips && !row.hasUpdate ? '<span>—</span>' : '')) +
            (row.entry && row.entry.author ? '<span>✍ ' + escapeHtml(row.entry.author) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="reu-rowactions">' +
          /* Der Text wird direkt in der Karte geschrieben. Dieser Knopf oeffnet
             nur noch die ausfuehrliche Maske (Tags, Verlaufs-Slider). Wohin er
             fuehrt, wird erst beim Klick entschieden - sonst wuerde er nach
             einer gerade inline angelegten Notiz eine zweite anlegen. */
          '<button type="button" class="btn btn-sm" data-act="details" data-sid="' + escapeAttr(row.sid) + '" title="Tags und Verlaufs-Slider erfassen">⋯ Details</button>' +
          '<span class="reu-chev">▶</span>' +
        '</div>' +
      '</div>';
    var body = expanded ? '<div class="reu-body">' + cardBodyHtml(row, r) + '</div>' : '';
    return '<section class="reu-card' + (row.discussed ? ' is-done' : '') + (expanded ? ' is-open' : '') + (row.discussed && !expanded ? ' dimmed' : '') + '" data-card="' + escapeAttr(row.sid) + '">' + head + body + '</section>';
  }
  /* Stichpunkte je Schueler. Die Punkte stehen im Text selbst, damit sie
     ueberall gleich aussehen - im Feld, im Dossier, im Protokoll - und man
     sie schon beim Tippen sieht. Die Vorliebe merkt sich das Geraet. */
  var BUL = '\u2022 ';
  var BUL_KEY = LS_PREFIX + 'reu_bullets';
  function bulletMap() {
    try { return JSON.parse(localStorage.getItem(BUL_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function bulletsOn(sid) { return !!bulletMap()[sid]; }
  function setBulletPref(sid, on) {
    var m = bulletMap();
    if (on) m[sid] = 1; else delete m[sid];
    try { localStorage.setItem(BUL_KEY, JSON.stringify(m)); } catch (e) {}
  }
  function stripBullet(line) { return line.replace(/^\s*[\u2022\-\*]\s*/, ''); }
  function toBullets(txt) {
    return String(txt || '').split('\n').map(function (l) {
      var t = stripBullet(l);
      return t.trim() ? BUL + t : '';
    }).join('\n');
  }
  function fromBullets(txt) {
    return String(txt || '').split('\n').map(stripBullet).join('\n');
  }
  function hasBullet(txt) {
    var l = String(txt || '').split('\n');
    for (var i = 0; i < l.length; i++) { if (l[i].trim()) return l[i].indexOf(BUL) === 0; }
    return false;
  }

  function cardBodyHtml(row, r) {
    var out = '';
    /* Direkt beschreibbar: kein „+ Update" davor noetig, wird automatisch
       gespeichert. Die ausfuehrliche Maske (Tags, Verlaufs-Slider) bleibt
       ueber den Knopf in der Kopfzeile erreichbar. */
    var bul = bulletsOn(row.sid);
    out += '<div class="reu-updwrap">' +
      '<div class="reu-updhead">' +
        '<button type="button" class="reu-bul' + (bul ? ' on' : '') + '" data-act="bullets" data-sid="' + escapeAttr(row.sid) + '" ' +
          'title="' + (bul ? 'Zurück zu Fließtext' : 'Als Stichpunkte schreiben') + '">\u2022 Stichpunkte</button>' +
      '</div>' +
      '<textarea class="reu-auto reu-updedit" data-upd="' + escapeAttr(row.sid) + '" rows="3" ' +
        'placeholder="Update zu ' + escapeAttr(row.s.name) + ' — einfach reinschreiben …">' +
        escapeHtml(row.entry && row.entry.text ? row.entry.text : '') + '</textarea>' +
      '<span class="reu-saved" data-saved="' + escapeAttr(row.sid) + '"></span></div>';
    if (row.hasUpdate && row.themes.length) {
      out += '<div class="reu-chips">' + row.themes.slice(0, 8).map(function (t) {
        return '<span class="chip theme-chip sev-' + t.severity + '" title="Treffer: ' + escapeAttr(t.terms.join(', ')) + '">' + escapeHtml(t.key) + '</span>';
      }).join('') + '</div>';
    }
    // Ziele
    out += '<div class="reu-goals">' +
      '<div class="reu-goals-head">🎯 Ziele<span class="sp"></span>' +
        (row.goals.length ? '<span style="font-weight:500;text-transform:none;letter-spacing:0;color:#8a7b52;">' + (row.goals.length - row.openGoals) + ' / ' + row.goals.length + ' erreicht</span>' : '') +
      '</div>';
    if (row.goals.length) {
      out += row.goals.map(function (g, gi) {
        return '<div class="reu-goal' + (g.done ? ' done' : '') + '">' +
          '<button class="reu-goal-check' + (g.done ? ' on' : '') + '" data-act="goal" data-sid="' + escapeAttr(row.sid) + '" data-gi="' + gi + '" title="Ziel erreicht">✓</button>' +
          '<span class="reu-goal-txt">' + escapeHtml(g.text) + '</span>' +
          '<button class="reu-goal-del" data-act="goaldel" data-sid="' + escapeAttr(row.sid) + '" data-gi="' + gi + '" title="Ziel löschen">×</button>' +
        '</div>';
      }).join('');
    } else {
      out += '<p class="muted" style="margin:2px 0 0;font-size:.85rem;">Noch keine Ziele.</p>';
    }
    out += '<div class="reu-goal-add"><input type="text" data-add-sid="' + escapeAttr(row.sid) + '" placeholder="Neues Ziel für diese Woche…">' +
      '<button type="button" class="btn btn-sm" data-act="goaladd" data-sid="' + escapeAttr(row.sid) + '">+ Ziel</button></div>';
    out += '</div>';
    out += '<div class="reu-detaillinks"><a href="#/student/' + escapeAttr(row.sid) + '" data-route="#/student/' + escapeAttr(row.sid) + '">Dossier & Verlauf öffnen →</a></div>';
    return out;
  }

  function listHtml(r) {
    var rows = rowsFor(r);
    var shown = rows.filter(function (x) { return matchesFilter(x) && matchesSearch(x); });
    if (!shown.length) {
      return '<div class="empty-state">Keine Schüler für diesen Filter' + (state.q ? ' / diese Suche' : '') + '.</div>';
    }
    // Indizes für Reihenfolge-Buttons beziehen sich auf die volle Liste
    var idxOf = {}; rows.forEach(function (x, i) { idxOf[x.sid] = i; });
    return shown.map(function (row) { return cardHtml(row, idxOf[row.sid], rows.length); }).join('');
  }

  /* Leiste der Ehemaligen: anklicken holt den Schueler in die Liste, damit man
     ueber ihn schreiben kann; nochmal anklicken raeumt ihn wieder weg. */
  function inactiveBarHtml(r) {
    var alt = inactiveStudents();
    if (!alt.length) return '';
    return '<div class="reu-inactive" id="reu-inactive">' +
      '<span class="ria-lbl">Ehemalige dazuholen</span>' +
      alt.map(function (s) {
        var e = r ? Repo.reunionEntryFor(r.date, s.id) : null;
        var hat = !!(e && e.text && e.text.trim());
        var an = isExtra(s.id);
        return '<button type="button" class="ria-chip' + (an ? ' on' : '') + (hat ? ' has' : '') + '" ' +
          'data-act="inactive" data-sid="' + escapeAttr(s.id) + '" ' +
          'title="' + (hat ? 'hat schon ein Update an diesem Tag' : (an ? 'wieder ausblenden' : 'über ' + escapeAttr(s.name) + ' sprechen')) + '">' +
          escapeHtml(s.name) + (hat ? ' <span class="ria-dot" aria-label="hat ein Update">●</span>' : '') + '</button>';
      }).join('') +
      '<span class="ria-hint">stehen nicht in der Liste</span>' +
    '</div>';
  }

  /* ---------- Zusammenbau ---------- */
  function bodyHtml() {
    var r = current();
    var rows = r ? rowsFor(r) : [];
    var inner;
    if (!r) {
      inner = '<div class="empty-state">Keine Réunion für dieses Datum.' +
        (reunions.length ? '' : ' Legen Sie oben die erste Réunion an.') + '</div>';
    } else {
      inner = filterHtml(rows) + '<div id="reu-org">' + orgHtml(r) + '</div>' +
        '<h3 class="reunion-section-title">Schüler · Reihenfolge der Versammlung</h3>' +
        inactiveBarHtml(r) +
        '<div class="reu-list" id="reu-list">' + listHtml(r) + '</div>';
    }
    return topbarHtml(r, rows) + '<div id="reu-main">' + inner + '</div>';
  }

  return {
    navKey: 'reunion',
    html: '<div class="reu2" id="reunion-wrap">' + bodyHtml() + '</div>',
    afterRender: function (root) {
      var wrap = qs('#reunion-wrap', root);

      function full() { wrap.innerHTML = bodyHtml(); growAll(); }
      function rerenderList() {
        var r = current(); if (!r) { full(); return; }
        var el = qs('#reu-list', wrap); if (el) el.innerHTML = listHtml(r);
        var fb = qs('.reu-filter', wrap); if (fb) fb.outerHTML = filterHtml(rowsFor(r));
        var ib = qs('#reu-inactive', wrap); if (ib) ib.outerHTML = inactiveBarHtml(r);
        growAll();
      }
      function rerenderStats() {
        var r = current(); if (!r) return;
        var rows = rowsFor(r);
        var s = qs('#reu-stats', wrap); if (s) s.outerHTML = statsHtml(r, rows);
      }
      function rebuildCard(sid) {
        var r = current(); var rows = rowsFor(r);
        var idx = rows.map(function (x) { return x.sid; }).indexOf(sid);
        if (idx < 0) return;
        var el = qs('.reu-card[data-card="' + cssEsc(sid) + '"]', wrap);
        if (el) el.outerHTML = cardHtml(rows[idx], idx, rows.length);
        growAll();
      }
      function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

      // Klick-Delegation
      wrap.addEventListener('click', function (e) {
        var t = e.target;
        var act = t.closest('[data-act]');
        var action = act ? act.getAttribute('data-act') : null;

        // interaktive Elemente in der Zeile nicht als "toggle" behandeln
        if (action === 'toggle') {
          if (t.closest('a,button,input,select,textarea,label,.reu-ordbtns')) return;
          var sid = act.getAttribute('data-sid');
          if (state.expanded[sid]) delete state.expanded[sid]; else state.expanded[sid] = true;
          rebuildCard(sid);
          return;
        }
        if (!action) return;

        if (action === 'goreu') { var d = act.getAttribute('data-date'); if (d) navigate('#/reunion?date=' + encodeURIComponent(d), true); return; }
        if (action === 'discuss') {
          e.preventDefault(); e.stopPropagation();
          var r = current(); var sid = act.getAttribute('data-sid');
          r.discussed = (r.discussed || []).slice();
          var p = r.discussed.indexOf(sid);
          if (p === -1) r.discussed.push(sid); else r.discussed.splice(p, 1);
          persist(r).then(function () { rebuildCard(sid); rerenderStats(); });
          return;
        }
        if (action === 'up' || action === 'down') {
          e.preventDefault(); e.stopPropagation();
          var r2 = current(); var sid2 = act.getAttribute('data-sid');
          var rows = rowsFor(r2).map(function (x) { return x.sid; });
          var i = rows.indexOf(sid2); if (i < 0) return;
          var j = action === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= rows.length) return;
          var tmp = rows[i]; rows[i] = rows[j]; rows[j] = tmp;
          r2.studentOrder = rows;
          persist(r2).then(rerenderList);
          return;
        }
        if (action === 'goal') {
          e.preventDefault(); e.stopPropagation();
          var r3 = current(); var sid3 = act.getAttribute('data-sid'), gi = +act.getAttribute('data-gi');
          var goals = goalsFor(r3, sid3);
          if (goals[gi]) { goals[gi].done = !goals[gi].done; writeGoals(r3, sid3, goals); persist(r3).then(function () { rebuildCard(sid3); rerenderStats(); }); }
          return;
        }
        if (action === 'goaldel') {
          e.preventDefault(); e.stopPropagation();
          var r4 = current(); var sid4 = act.getAttribute('data-sid'), gi4 = +act.getAttribute('data-gi');
          var g4 = goalsFor(r4, sid4); g4.splice(gi4, 1); writeGoals(r4, sid4, g4);
          persist(r4).then(function () { rebuildCard(sid4); rerenderStats(); });
          return;
        }
        if (action === 'goaladd') {
          e.preventDefault();
          var sid5 = act.getAttribute('data-sid');
          var inp = qs('input[data-add-sid="' + cssEsc(sid5) + '"]', wrap);
          addGoal(sid5, inp);
          return;
        }
        if (action === 'collapseall') {
          var r6 = current(); var anyExp = Object.keys(state.expanded).length > 0;
          state.expanded = {};
          if (!anyExp && r6) rowsFor(r6).forEach(function (x) { state.expanded[x.sid] = true; });
          rerenderList();
          return;
        }
        if (action === 'orderedit') { state.orderEdit = !state.orderEdit; full(); return; }
        if (action === 'details') {
          var rd = current(); var sd = act.getAttribute('data-sid');
          if (!rd || !sd) return;
          var ed = Repo.reunionEntryFor(rd.date, sd);
          navigate(ed
            ? ('#/entry/' + encodeURIComponent(ed.id) + '/edit?return=' + encodeURIComponent(returnRoute()))
            : ('#/entry/new/' + encodeURIComponent(sd) + '?date=' + encodeURIComponent(rd.date) +
               '&category=' + encodeURIComponent('Team-Réunion') + '&return=' + encodeURIComponent(returnRoute())));
          return;
        }
        if (action === 'bullets') {
          var bsid = t.getAttribute('data-sid');
          var bta = qs('textarea[data-upd="' + bsid + '"]', wrap);
          var an = !bulletsOn(bsid);
          setBulletPref(bsid, an);
          t.classList.toggle('on', an);
          t.title = an ? 'Zurück zu Fließtext' : 'Als Stichpunkte schreiben';
          if (bta) {
            bta.value = an ? toBullets(bta.value) : fromBullets(bta.value);
            autoGrow(bta); bta.focus();
            try { bta.setSelectionRange(bta.value.length, bta.value.length); } catch (e) {}
            clearTimeout(saveT['u' + bsid]); saveUpd(bsid, bta);
          }
          return;
        }
        if (action === 'inactive') {
          var isid = t.getAttribute('data-sid');
          var rr = current();
          var ie = rr ? Repo.reunionEntryFor(rr.date, isid) : null;
          if (state.extra[isid]) { delete state.extra[isid]; delete state.expanded[isid]; }
          else { state.extra[isid] = true; state.expanded[isid] = true; }
          rerenderList(); rerenderStats();
          if (state.extra[isid]) {
            var k = qs('.reu-card[data-card="' + cssEsc(isid) + '"]', wrap);
            if (k && k.scrollIntoView) k.scrollIntoView({ block: 'center' });
            var ta = qs('textarea[data-upd="' + cssEsc(isid) + '"]', wrap);
            if (ta) ta.focus();
          }
          return;
        }
        if (action === 'print') { printProtocol(); return; }
        if (action === 'word') { wordProtocol(); return; }
      });

      /* ---------- Direkt schreiben, automatisch speichern ----------
         Waehrend des Tippens wird NICHT neu gezeichnet, sonst springt der
         Cursor. Es werden nur der Zaehler, die Marke und die Statistik
         nachgefuehrt. */
      function autoGrow(ta) {
        if (!ta || ta.tagName !== 'TEXTAREA') return;
        ta.style.height = 'auto';
        ta.style.height = (ta.scrollHeight + 2) + 'px';
      }
      function markSaved(el) {
        if (!el) return;
        el.textContent = '✓ gespeichert';
        el.classList.add('on');
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.remove('on'); }, 1600);
      }
      function saveOrg() {
        var r = current(); if (!r) return;
        var ta = qs('#org-edit', wrap); if (!ta) return;
        r.orgItems = ta.value.split(/\n\s*\n/).map(function (x) { return x.trim(); }).filter(Boolean);
        var gEl = qs('#org-group', wrap);
        if (gEl) {
          if (!r.goals || typeof r.goals !== 'object') r.goals = {};
          var gv = gEl.value.trim();
          r.goals.group = gv ? [gv] : [];
        }
        persist(r).then(function () {
          var c = qs('#org-count', wrap); if (c) c.textContent = r.orgItems.length;
          markSaved(qs('#org-saved', wrap));
          rerenderStats();
        });
      }
      function isPlainAuto(entry) {
        if (!entry || entry.report) return false;
        var tg = entry.tags || [];
        if (tg.length > 1) return false;
        if (tg.length === 1 && tg[0] !== 'Réunion') return false;
        var sl = entry.sliders || {};
        for (var k in sl) { if (sl[k] != null) return false; }
        return true;
      }
      function saveUpd(sid, ta) {
        var r = current(); if (!r || !sid || !ta) return;
        var txt = ta.value;
        var entry = Repo.reunionEntryFor(r.date, sid);
        var done = function () {
          var card = qs('[data-card="' + cssEsc(sid) + '"]', wrap);
          var flag = card && qs('.reu-flag.upd, .reu-flag.noupd', card);
          if (flag) {
            var has = !!txt.trim();
            flag.className = 'reu-flag ' + (has ? 'upd' : 'noupd');
            flag.textContent = has ? 'Update' : 'kein Update';
          }
          markSaved(card && qs('[data-saved="' + cssEsc(sid) + '"]', card));
          rerenderStats();
        };
        if (!txt.trim()) {
          /* Leer geraeumt: einen hier angelegten, sonst leeren Eintrag wieder
             entfernen. Haengt daran mehr als der automatische Tag - eigene
             Tags, ein Bericht oder gesetzte Verlaufs-Slider - bleibt er stehen. */
          if (entry && isPlainAuto(entry)) {
            Repo.deleteEntry(entry.id).then(done);
          } else { done(); }
          return;
        }
        var ich = (window.KB_USER && KB_USER.get && KB_USER.get()) || '';
        var payload = {
          id: entry ? entry.id : undefined,
          studentId: sid, date: r.date,
          author: entry && entry.author ? entry.author : (ich || 'Team (Réunion)'),
          updatedBy: ich || (entry && entry.updatedBy) || '',
          category: 'Team-Réunion',
          tags: entry && entry.tags && entry.tags.length ? entry.tags : ['Réunion'],
          text: txt,
          sliders: entry ? entry.sliders : null,
          createdAt: entry ? entry.createdAt : undefined
        };
        if (entry && entry.report) payload.report = entry.report;
        Repo.saveEntry(payload).then(done);
      }
      var saveT = {};
      function queueSave(key, fn) {
        clearTimeout(saveT[key]);
        saveT[key] = setTimeout(fn, 700);
      }
      wrap.addEventListener('input', function (e) {
        var t = e.target;
        if (t.id === 'org-edit' || t.id === 'org-group') { autoGrow(t); queueSave('org', saveOrg); return; }
        var usid = t.getAttribute && t.getAttribute('data-upd');
        if (usid) {
          /* Erstes Zeichen in einem Stichpunkt-Feld bekommt gleich den Punkt. */
          if (bulletsOn(usid) && t.value.trim() && !hasBullet(t.value)) {
            var ende = t.selectionStart === t.value.length;
            t.value = toBullets(t.value);
            if (ende) { try { t.setSelectionRange(t.value.length, t.value.length); } catch (e2) {} }
          }
          autoGrow(t); queueSave('u' + usid, function () { saveUpd(usid, t); }); return;
        }
      });
      /* Enter beginnt im Stichpunkt-Modus den naechsten Punkt. */
      wrap.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' || e.shiftKey) return;
        var t = e.target;
        var usid = t.getAttribute && t.getAttribute('data-upd');
        if (!usid || !bulletsOn(usid)) return;
        e.preventDefault();
        var a = t.selectionStart, b = t.selectionEnd;
        t.value = t.value.slice(0, a) + '\n' + BUL + t.value.slice(b);
        var pos = a + 1 + BUL.length;
        try { t.setSelectionRange(pos, pos); } catch (e3) {}
        autoGrow(t);
        queueSave('u' + usid, function () { saveUpd(usid, t); });
      });
      /* Beim Verlassen sofort sichern, nicht erst nach der Wartezeit. */
      wrap.addEventListener('focusout', function (e) {
        var t = e.target;
        if (t.id === 'org-edit' || t.id === 'org-group') { clearTimeout(saveT.org); saveOrg(); return; }
        var usid = t.getAttribute && t.getAttribute('data-upd');
        if (usid) { clearTimeout(saveT['u' + usid]); saveUpd(usid, t); return; }
      });
      /* Felder auf ihren Inhalt einstellen, sobald sie sichtbar werden. */
      function growAll() { (wrap.querySelectorAll ? wrap.querySelectorAll('textarea.reu-auto') : []).forEach(autoGrow); }
      wrap._growAll = growAll;
      setTimeout(growAll, 0);

      // Suche + Ziel-Eingabe (Enter)
      wrap.addEventListener('input', function (e) {
        if (e.target.id === 'reu-q') {
          state.q = e.target.value;
          clearTimeout(wrap._st); wrap._st = setTimeout(function () {
            var r = current(); if (r) { var el = qs('#reu-list', wrap); if (el) el.innerHTML = listHtml(r); }
          }, 160);
        }
      });
      wrap.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('data-add-sid')) {
          e.preventDefault(); addGoal(e.target.getAttribute('data-add-sid'), e.target);
        }
      });
      wrap.addEventListener('change', function (e) {
        if (e.target.id === 'reu-date') navigate('#/reunion?date=' + encodeURIComponent(e.target.value), true);
      });

      // Segment-Buttons
      wrap.addEventListener('click', function (e) {
        var seg = e.target.closest('.reu-seg button'); if (!seg) return;
        state.filter = seg.getAttribute('data-filter');
        rerenderList();
      });

      // "+ Nächste Réunion"
      var createBtn = qs('#reu-create-next', wrap);
      if (createBtn) createBtn.addEventListener('click', function () {
        var nm = nextMondayIso();
        var last = Repo.listReunions()[0];
        var carryGoals = {};
        if (last && last.goals) {
          Object.keys(last.goals).forEach(function (k) {
            if (k === 'group') { carryGoals.group = (last.goals.group || []).slice(); return; }
            var open = normGoals(last.goals[k]).filter(function (g) { return !g.done; }).map(function (g) { return { text: g.text, done: false }; });
            if (open.length) carryGoals[k] = open;
          });
        }
        Repo.saveReunion({
          date: nm, orgItems: [],
          studentOrder: last ? (last.studentOrder || []).slice() : Repo.listStudents().map(function (s) { return s.id; }),
          goals: carryGoals, discussed: []
        }).then(function () {
          showToast('Réunion für ' + formatDate(nm) + ' angelegt (offene Ziele übernommen).');
          navigate('#/reunion?date=' + encodeURIComponent(nm), true);
        }).catch(function (err) { showToast('Fehler beim Anlegen: ' + err.message, { error: true }); });
      });

      function addGoal(sid, inp) {
        if (!inp) return;
        var txt = inp.value.trim(); if (!txt) return;
        var r = current(); var goals = goalsFor(r, sid);
        goals.push({ text: txt, done: false }); writeGoals(r, sid, goals);
        persist(r).then(function () { rebuildCard(sid); rerenderStats(); });
      }

      /* Das Protokoll einer Réunion — einmal gebaut, dreifach genutzt:
         Bildschirm-Druckansicht (daraus wird im Dialog das PDF), Word-Datei
         und spaeter evtl. mehr. */
      /* ---------- Protokoll ----------
         Ein Blatt, das man jemandem in die Hand geben kann: Briefkopf,
         Kennzahlenzeile, klar abgesetzte Abschnitte, pro Schüler ein Block,
         der nie über einen Seitenumbruch zerrissen wird.
         Dasselbe Protokoll geht in die Druckansicht (daraus das PDF) und in
         die Word-Datei. */
      function protocolCss() {
        return '#print-sheet{display:none;}' +
          '@media print{' +
            'html,body{height:auto !important;min-height:0 !important;overflow:visible !important;' +
              'margin:0 !important;padding:0 !important;background:#fff !important;}' +
            'body>*{display:none !important;}' +
            '#print-sheet{display:block !important;position:static !important;}' +
            '@page{size:A4;margin:18mm 16mm 16mm;}' +
          '}' +
          '#print-sheet{font-family:"Segoe UI",Calibri,system-ui,sans-serif;color:#1a1a1a;line-height:1.45;}' +
          '#print-sheet .rp-head{border-bottom:2.5px solid #1a1a1a;padding-bottom:9px;margin-bottom:2px;}' +
          '#print-sheet .rp-org-name{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#666;margin:0 0 3px;}' +
          '#print-sheet .rp-h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;}' +
          '#print-sheet .rp-when{font-size:13px;color:#333;margin:3px 0 0;}' +

          '#print-sheet .rp-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;' +
            'color:#1a1a1a;border-bottom:1px solid #1a1a1a;padding-bottom:3px;margin:22px 0 10px;}' +
          '#print-sheet .rp-foot{page-break-inside:avoid;}' +
          '#print-sheet .rp-lead{font-size:12.5px;margin:0 0 8px;padding:7px 10px;background:#f4f4f2;border-left:3px solid #8a8a8a;}' +
          '#print-sheet ol.rp-org{font-size:12.5px;margin:0;padding-left:20px;text-align:justify;hyphens:auto;-webkit-hyphens:auto;}' +
          '#print-sheet ol.rp-org li{margin-bottom:5px;}' +
          '#print-sheet .rp-org-sub{color:#555;font-size:11.5px;}' +
          '#print-sheet .rp-stud{break-inside:avoid;page-break-inside:avoid;padding:9px 0 10px;border-bottom:1px solid #e2e2e2;}' +
          '#print-sheet .rp-stud h4{font-size:13.5px;margin:0 0 4px;display:flex;align-items:baseline;}' +
          '#print-sheet .rp-nr{display:inline-block;min-width:19px;color:#8a8a8a;font-weight:600;}' +
          '#print-sheet .rp-by{font-size:10px;font-weight:400;color:#777;margin-left:auto;' +
            'padding-left:10px;white-space:nowrap;}' +
          '#print-sheet .rp-flag{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;' +
            'border:1px solid currentColor;border-radius:9px;padding:0 6px;margin-left:8px;}' +
          '#print-sheet .rp-done{color:#1d6b45;}' +
          '#print-sheet .rp-upd{font-size:12px;white-space:pre-wrap;margin:0 0 0 27px;line-height:1.55;' +
            'text-align:justify;hyphens:auto;-webkit-hyphens:auto;}' +
          '#print-sheet .rp-upd.rp-none{color:#999;font-style:italic;}' +
          '#print-sheet .rp-goals{font-size:11.5px;margin:5px 0 0 27px;padding:0;list-style:none;}' +
          '#print-sheet .rp-goals li{margin-bottom:2px;}' +
          '#print-sheet .rp-foot{margin-top:16px;padding-top:7px;border-top:1px solid #d8d8d8;font-size:10px;color:#888;}';
      }

      var WOCHENTAG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
      var MONAT = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
        'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      function langesDatum(iso) {
        var t = String(iso || '').split('-');
        if (t.length !== 3) return formatDate(iso);
        var d = new Date(+t[0], +t[1] - 1, +t[2]);
        if (isNaN(d.getTime())) return formatDate(iso);
        return WOCHENTAG[d.getDay()] + ', ' + d.getDate() + '. ' + MONAT[d.getMonth()] + ' ' + d.getFullYear();
      }

      function protocolHtml(r, rows) {
        var h = new Date();
        var stempel = ('0' + h.getDate()).slice(-2) + '.' + ('0' + (h.getMonth() + 1)).slice(-2) + '.' + h.getFullYear();
        var wer = (window.KB_USER && KB_USER.get && KB_USER.get()) || '';

        /* Kopf: Haus, Anlass, Datum. Mehr nicht - Zahlen wie "0 / 11
           besprochen" standen frueher hier, sagen auf einem Protokoll aber
           nichts und haben den Anfang zugestellt. */
        var html = '<div class="rp-head">' +
            '<p class="rp-org-name">Annexe Junglinster · Team-Réunion</p>' +
            '<h1 class="rp-h1">Protokoll</h1>' +
            '<p class="rp-when">' + escapeHtml(langesDatum(r.date)) + '</p>' +
          '</div>';

        var group = (r.goals && r.goals.group) || [];
        var groupTxt = Array.isArray(group) ? group.join(' ') : String(group || '');
        if (groupTxt.trim()) {
          html += '<p class="rp-lead"><strong>Gruppenziel der Woche:</strong> ' + escapeHtml(groupTxt) + '</p>';
        }

        if ((r.orgItems || []).length) {
          html += '<div class="rp-sec">Organisation</div><ol class="rp-org">' +
            r.orgItems.map(function (it) {
              var teile = String(it).split('\n').filter(function (z) { return z.trim(); });
              return '<li>' + escapeHtml(teile[0] || '') +
                (teile.length > 1 ? '<br><span class="rp-org-sub">' + escapeHtml(teile.slice(1).join(' — ')) + '</span>' : '') +
              '</li>';
            }).join('') + '</ol>';
        }

        html += '<div class="rp-sec">Schüler</div>';
        rows.forEach(function (row, i) {
          /* Wer es geschrieben hat, steht am Kopf der Zeile - in einer Réunion
             schreiben mehrere, und im Nachhinein will man das wissen.
             Die Marke "offen" faellt weg; nur "besprochen" sagt etwas aus. */
          var verfasser = row.hasUpdate ? String(row.entry.author || '').trim() : '';
          var zuletzt = row.hasUpdate ? String(row.entry.updatedBy || '').trim() : '';
          var von = verfasser;
          if (zuletzt && zuletzt !== verfasser) von = verfasser ? (verfasser + ', zuletzt ' + zuletzt) : zuletzt;
          html += '<div class="rp-stud">' +
            '<h4><span class="rp-nr">' + (i + 1) + '.\u00a0</span>' + escapeHtml(row.s.name) +
              (row.discussed ? '\u00a0<span class="rp-flag rp-done">besprochen</span>' : '') +
              (von ? '\u00a0<span class="rp-by">notiert von ' + escapeHtml(von) + '</span>' : '') +
            '</h4>' +
            '<div class="rp-upd' + (row.hasUpdate ? '' : ' rp-none') + '">' +
              (row.hasUpdate ? escapeHtml(row.entry.text) : 'Kein Update erfasst.') + '</div>';
          if (row.goals.length) {
            html += '<ul class="rp-goals">' + row.goals.map(function (g) {
              return '<li>' + (g.done ? '\u2611' : '\u2610') + ' ' + escapeHtml(g.text) + '</li>';
            }).join('') + '</ul>';
          }
          html += '</div>';
        });

        html += '<p class="rp-foot">Klassebuch · Annexe Junglinster — interne Unterlage, vertraulich zu behandeln.' +
          '<br>Erstellt am ' + escapeHtml(stempel) + (wer ? ' von ' + escapeHtml(wer) : '') + '.</p>';
        return html;
      }

      function printProtocol() {
        var r = current(); if (!r) return;
        var old = document.getElementById('print-sheet');
        if (old && old.parentNode) old.parentNode.removeChild(old);
        var st = document.getElementById('print-sheet-css');
        if (!st) { st = document.createElement('style'); st.id = 'print-sheet-css'; document.head.appendChild(st); }
        st.textContent = protocolCss();
        var holder = document.createElement('div');
        holder.innerHTML = '<div class="print-sheet" id="print-sheet">' + protocolHtml(r, rowsFor(r)) + '</div>';
        document.body.appendChild(holder.firstChild);
        window.print();
      }

      /* Word öffnet HTML mit diesem Kopf als Dokument — offline, ohne
         Zusatzbibliothek. Die Formate stehen im Dokument selbst, damit es
         auch außerhalb der App stimmt. Word kann kein Flexbox, darum werden
         Kopf und Kennzahlenzeile hier auf normale Blöcke zurückgesetzt. */
      function wordProtocol() {
        var r = current(); if (!r) return;
        var css =
          'body{font-family:Calibri,"Segoe UI",sans-serif;font-size:11pt;color:#1a1a1a;line-height:1.45;}' +
          '.rp-head{border-bottom:2.5pt solid #1a1a1a;padding-bottom:6pt;margin-bottom:2pt;}' +
          '.rp-org-name{font-size:7.5pt;letter-spacing:1.4pt;text-transform:uppercase;color:#666;margin:0 0 2pt;}' +
          '.rp-h1{font-size:19pt;font-weight:bold;margin:0;}' +
          '.rp-when{font-size:11pt;color:#333;margin:2pt 0 0;}' +
          '.rp-sec{font-size:8.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:1pt;' +
            'border-bottom:0.75pt solid #1a1a1a;padding-bottom:2pt;margin:14pt 0 6pt;}' +
          '.rp-lead{font-size:10pt;margin:0 0 6pt;padding:5pt 7pt;background:#f4f4f2;border-left:2.25pt solid #8a8a8a;}' +
          'ol.rp-org{font-size:10pt;margin:0 0 0 14pt;text-align:justify;}' +
          'ol.rp-org li{margin-bottom:3pt;}' +
          '.rp-org-sub{color:#555;font-size:9pt;}' +
          '.rp-stud{page-break-inside:avoid;padding:5pt 0 6pt;border-bottom:0.75pt solid #e2e2e2;}' +
          '.rp-stud h4{font-size:11pt;margin:0 0 2pt;}' +
          '.rp-nr{color:#8a8a8a;font-weight:bold;mso-spacerun:yes;}' +
          '.rp-by{font-size:8pt;font-weight:normal;color:#777;}' +
          '.rp-flag{font-size:7.5pt;font-weight:bold;text-transform:uppercase;color:#1d6b45;}' +
          '.rp-done{color:#1d6b45;}' +
          '.rp-upd{font-size:10pt;white-space:pre-wrap;margin:0 0 0 16pt;text-align:justify;}' +
          '.rp-upd.rp-none{color:#999;font-style:italic;}' +
          '.rp-goals{font-size:9.5pt;margin:3pt 0 0 16pt;list-style:none;}' +
          '.rp-foot{margin-top:12pt;padding-top:5pt;border-top:0.75pt solid #d8d8d8;font-size:7.5pt;color:#888;}' +
          '@page{size:A4;margin:2cm;}';
        var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
          'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
          '<head><meta charset="utf-8"><title>Réunion-Protokoll ' + escapeHtml(r.date) + '</title>' +
          '<style>' + css + '</style></head><body>' + protocolHtml(r, rowsFor(r)) + '</body></html>';
        var blob = new Blob(['﻿' + doc], { type: 'application/msword' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'Reunion-Protokoll-' + r.date + '.doc';
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      }
    }
  };
}


'use strict';

/* ============================================================
   Ansicht — Organisation (chronologisches Logbuch)
   Alle Orga-Punkte aus allen Réunions, neueste zuerst,
   mit Volltext-Filter. Klick auf das Datum öffnet die Réunion.
   ============================================================ */

function viewOrgLog(params, query) {
  var state = { q: query.q || '' };

  function filteredReunions() {
    var q = state.q.trim().toLowerCase();
    return Repo.listReunions().map(function (r) {
      var items = (r.orgItems || []);
      if (q) items = items.filter(function (it) { return it.toLowerCase().indexOf(q) !== -1; });
      return { reunion: r, items: items };
    }).filter(function (x) { return x.items.length > 0; });
  }

  function listHtml() {
    var groups = filteredReunions();
    var total = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    if (!groups.length) {
      return '<div class="empty-state">' + (state.q ? 'Keine Orga-Punkte für „' + escapeHtml(state.q) + '".' : 'Noch keine Orga-Punkte erfasst.') + '</div>';
    }
    return '<p class="muted">' + pluralize(total, 'Orga-Punkt', 'Orga-Punkte') + ' in ' + pluralize(groups.length, 'Réunion', 'Réunions') + '</p>' +
      groups.map(function (g) {
        var r = g.reunion;
        return '<section class="card org-log-group">' +
          '<div class="org-log-head">' +
            '<a href="#/reunion?date=' + escapeAttr(r.date) + '" data-route="#/reunion?date=' + escapeAttr(r.date) + '" class="org-log-date">Réunion vom ' + escapeHtml(formatDate(r.date)) + '</a>' +
            '<span class="muted">' + pluralize(g.items.length, 'Punkt', 'Punkte') + '</span>' +
          '</div>' +
          '<ul class="org-list">' + g.items.map(function (it) {
            var parts = it.split('\n');
            var head = state.q ? highlightMatch(parts[0], state.q) : escapeHtml(parts[0]);
            return '<li>' + head +
              (parts.length > 1 ? '<ul class="org-sublist">' + parts.slice(1).map(function (p) {
                return '<li>' + (state.q ? highlightMatch(p, state.q) : escapeHtml(p)) + '</li>';
              }).join('') + '</ul>' : '') +
            '</li>';
          }).join('') + '</ul>' +
        '</section>';
      }).join('');
  }

  var html =
    '<div class="page-head"><div><h2>Organisation</h2>' +
    '<p class="muted">Chronologisches Logbuch aller Orga-Punkte aus den Montags-Réunions (neueste zuerst).</p></div></div>' +
    '<div class="card export-config no-print" style="margin-bottom:18px;">' +
      '<div class="field"><label for="org-q">Filter</label>' +
      '<input type="search" id="org-q" placeholder="z. B. Mobibus, Deadline, Ausfluch…" value="' + escapeAttr(state.q) + '"></div>' +
    '</div>' +
    '<div id="org-log">' + listHtml() + '</div>';

  return {
    navKey: 'orga',
    html: html,
    afterRender: function (root) {
      var input = qs('#org-q', root);
      var log = qs('#org-log', root);
      var timer = null;
      input.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          state.q = input.value;
          log.innerHTML = listHtml();
        }, 200);
      });
    }
  };
}

/* ============================================================
   App-Shell, Routing, Bootstrap
   ============================================================ */

window.SEED_DATA = {"students":[],"entries":[],"reunions":[],"reunionEntries":[]};

var NAV_ITEMS = [

function parseHash() {
  var raw = location.hash.replace(/^#\/?/, '');
  var qIdx = raw.indexOf('?');
  var path = qIdx === -1 ? raw : raw.slice(0, qIdx);
  var queryStr = qIdx === -1 ? '' : raw.slice(qIdx + 1);
  var query = {};
  queryStr.split('&').forEach(function (pair) {
    if (!pair) return;
    var kv = pair.split('=');

var KB_PEI_HEADS = [
  { key: 'fortschritte', label: 'Fortschritte', res: [/Fortschritte des Sch[üu]lers[^\n]*/i] },
  { key: 'themen', label: 'Anzugehende Themen', res: [/Anzugehende Themen\b/i] },
  { key: 'ziele', label: 'Zielerfassung und Umsetzung', res: [/Zielerfassung und Umsetzung/i, /Zielerfassung/i, /Zielsetzung(?:en)?\b/i, /F[öo]rderziele?\b/i, /Entwicklungsziele?\b/i, /Resultate des ELDiB/i, /ELDiB[- ]?Ziele/i] }

function kbParseGoals(zieleText) {
  if (!zieleText) return [];
  /* Robust gegen PDF-Eigenheiten: das Trennzeichen zwischen Domäne und Nummer
     darf Bindestrich, Gedankenstrich (–/—), Unicode-Hyphen, Minus, Punkt,
     Mittelpunkt, Doppelpunkt, Leerzeichen ODER GAR NICHTS sein. Domänen
     längste-zuerst (SOZ/KOG vor V/K). Beispiele: „V-19", „SOZ 32", „KOG.7",
     „K–15", „V19". */
  /* Erst ALLE Code-Positionen sammeln (begrenzen die Blöcke korrekt, auch wenn
     der Text einzeilig ist). Den Titel NICHT gierig mit-fangen, sondern aus dem
     Text ZWISCHEN den Codes ableiten — sonst verschluckt ein Treffer die
     nachfolgenden Codes (typisch bei PDF-Text ohne Zeilenumbrüche). */
  var goals = [], seen = {}, re = /\b(SOZ|KOG|V|K)\s*[-‐‑‒–—−.·‧:]?\s*(\d{1,3})\b/g, m, marks = [];
  while ((m = re.exec(zieleText))) {
    marks.push({ code: m[1] + '-' + parseInt(m[2], 10), domain: m[1], idx: m.index, end: re.lastIndex });
  }
  for (var i = 0; i < marks.length; i++) {
    if (seen[marks[i].code]) continue; seen[marks[i].code] = 1;
    var s = marks[i].end, e = (i + 1 < marks.length) ? marks[i + 1].idx : zieleText.length, block = zieleText.slice(s, e);
    var tM = block.match(/^[\s.:–—\-]*([^\n:]{0,80})/);
    var title = tM ? tM[1].replace(/\s+/g, ' ').trim() : '';
    var zf = block.match(/Zielformulierung\s*:?\s*[„“"']?\s*([\s\S]*?)[”"'„“]?\s*(?:M[öo]gliche Umsetzung|$)/i);
    var formul = zf ? zf[1].replace(/\s+/g, ' ').replace(/[”"'„“]+$/, '').trim() : '';
    /* „Mögliche Umsetzung" -> Liste der Methodiken (DBT-Skills, Rollenspiele …) */
    var methods = [], mu = block.match(/M[öo]gliche Umsetzung\s*:?/i);
    if (mu) {
      var after = block.slice(mu.index + mu[0].length).split('\n');
      for (var k = 0; k < after.length; k++) {
        var ln = after[k].replace(/^[\s\-–—•·*]+/, '').replace(/\s+/g, ' ').trim();
        if (!ln) continue;
        if (/^(Verhalten|Kommunikation|Sozialisation|Kognition)\b/i.test(ln)) break;
        if (/^Aufgrund der Tatsache|^Zielerfassung|^Datum\s*:/i.test(ln)) break;
        methods.push(ln.length > 90 ? ln.slice(0, 90) + '…' : ln);
        if (methods.length >= 8) break;
      }
    }
    goals.push({ code: marks[i].code, domain: marks[i].domain, title: title, formulation: formul, methods: methods });
  }
  return goals;
}
function kbParseRecommendations(t) {
  var out = [], re = /☒\s*([^\n☐☒]{1,200})/g, m;
  while ((m = re.exec(t))) { var v = m[1].split(/Sehr geehrte|Betrifft|Anlass des/)[0].replace(/\s+/g, ' ').trim(); if (v.length > 110) v = v.slice(0, 110).trim() + '…'; if (v) out.push(v); }
  return out;
}
function kbParseReport(raw) {
  var t = kbNorm(raw), type = kbDetectType(t), id = kbParseIdentity(t);
  var res = { type: type, identity: id, reportDate: kbReportDate(t), sections: {}, goals: [], recommendations: [] };
  if (type === 'PEI') { res.sections = kbSliceSections(t, KB_PEI_HEADS); res.goals = kbParseGoals(res.sections.ziele && res.sections.ziele.text); }
  else { res.sections = kbSliceSections(t, KB_DS_HEADS); res.recommendations = kbParseRecommendations(t); res.goals = []; }
  /* Fallback: Wenn im Ziele-Abschnitt nichts erkannt wurde (Abschnitts-
     Überschrift anders benannt, PDF-Layout, DS mit ELDiB-Resultaten …),
     das GANZE Dokument nach ELDiB-Codes durchsuchen. */
  if (!res.goals.length) res.goals = kbParseGoals(t);
  return res;
}

/* ---- Bericht -> lesbarer Dossier-Eintragstext (ohne Matrikel/Geburtsdatum) ---- */
function kbReportToEntryText(r) {
  var L = [], typeLabel = r.type === 'PEI' ? 'Individueller Förderplan (PEI)' : (r.type === 'DS' ? 'Spezialisierte Diagnose (DS)' : 'Bericht');
  L.push('=== ' + typeLabel + ' ===');
  if (r.reportDate) L.push('Stand: ' + r.reportDate);
  if (r.identity && r.identity.schoolClass) L.push('Schule/Klasse: ' + r.identity.schoolClass);
  L.push('');
  if (r.recommendations && r.recommendations.length) { L.push('Empfehlung des CDSE: ' + r.recommendations.join('; ')); L.push(''); }
  var order = r.type === 'PEI'
    ? [['fortschritte', 'Fortschritte'], ['themen', 'Anzugehende Themen']]
    : [['anlass', 'Anlass des Berichtes'], ['situation', 'Aktuelle Schulsituation'], ['sozial', 'Sozialbericht'], ['schule', 'Aus Sicht der Schule'], ['cdse', 'Standpunkt des CDSE'], ['schueler', 'Standpunkt des Schülers'], ['eltern', 'Standpunkt der Eltern'], ['beduerfnisse', 'Spezifische Bedürfnisse'], ['diagnose', 'Spezialisierte Diagnose / ELDiB'], ['zusammenfassung', 'Zusammenfassung & Empfehlungen']];
  order.forEach(function (o) { var sec = r.sections && r.sections[o[0]]; if (sec && sec.text) { L.push('— ' + o[1] + ' —'); L.push(sec.text.trim()); L.push(''); } });
  if (r.goals && r.goals.length) {
    L.push('— Förderziele (ELDiB) —');
    r.goals.forEach(function (g) { L.push('• [' + g.code + '] ' + (g.title || '') + (g.formulation ? ': „' + g.formulation + '"' : '')); });
    L.push('');
  }
  return L.join('\n').trim();
}

/* ---- Hub-Datenzugriff ---- */
function kbStudentReports(id) {
  return Repo.entriesForStudent(id).filter(function (e) { return e.report; }).sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
}
window.KB_REPORTS = {
  forStudent: kbStudentReports,
  latest: function (id) { return kbStudentReports(id)[0] || null; },
  currentGoals: function (id) {
    var reps = kbStudentReports(id);
    for (var i = 0; i < reps.length; i++) {
      var rp = reps[i].report; if (!rp) continue;
      var goals = rp.goals || [];
      /* Methodiken nachliefern (frühere Importe hatten sie noch nicht):
         falls vorhanden, Ziele aus dem gespeicherten ELDiB-Abschnitt neu lesen. */
      if (rp.sections && rp.sections.ziele && rp.sections.ziele.text) {
        var reparsed = kbParseGoals(rp.sections.ziele.text);
        if (reparsed && reparsed.length) goals = reparsed;

      if (goals.length) return { date: reps[i].date, goals: goals, type: rp.type };
    }
    return null;
  },
  summary: function (id) {
    var r = kbStudentReports(id)[0]; if (!r) return null; var rp = r.report || {};
    return { date: r.date, type: rp.type || '', recommendations: rp.recommendations || [], goalsCount: (rp.goals || []).length, schoolClass: (rp.identity || {}).schoolClass || '', count: kbStudentReports(id).length, entryId: r.id };
  },
  importRoute: function (id) { return '#/report-import' + (id ? '?student=' + encodeURIComponent(id) : ''); }

function kbGenAnonLabel() {
  var used = {}; Repo.listStudents().forEach(function (s) { if (s.anonLabel) used[s.anonLabel] = 1; });
  var Lt = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  if (parts[0] === 'entry') {
    if (parts[1] === 'new') return viewEntryForm({
      studentId: parts[2] ? decodeURIComponent(parts[2]) : (query.student || ''),
      presetDate: query.date || '',
      presetCategory: query.category || '',
      returnTo: query['return'] || ''
    });
    if (parts[1] && parts[2] === 'edit') return viewEntryForm({ entryId: decodeURIComponent(parts[1]), returnTo: query['return'] || '' });
  }

  if (parts[0] === 'reunion') return viewReunion({}, query);
  if (parts[0] === 'orga') return viewOrgLog({}, query);
  if (parts[0] === 'search') return viewSearch({}, query);
  if (parts[0] === 'themes') return viewThemeAnalysis({}, query);
  if (parts[0] === 'export') return viewPdfExport({}, query);
  if (parts[0] === 'ai-export') return viewAiExport({}, query);
  if (parts[0] === 'report-import') return viewReportImport({}, query);
  if (parts[0] === 'backup') return viewBackup();

  return viewDashboard({}, query);
}

function navigate(hash, replace) {
  if (replace) {
    history.replaceState(null, '', hash);
    render();
  } else if (location.hash === hash) {
    render();
  } else {
    location.hash = hash;
  }
}

/* Neu zeichnen, ohne den Leser zu verlieren.

   render() baut die ganze Ansicht neu auf. Beim Wechsel auf eine andere Seite
   gehoert der Blick nach oben - aber render() laeuft auch, wenn nur gespeichert
   oder vom Team-Abgleich etwas nachgetragen wurde. Dann sprang die Seite
   jedes Mal an den Anfang, mitten im Arbeiten.

   Darum: gleiche Adresse heisst gleiche Seite, also Scrollstand halten. Und
   wer gerade in einem Feld schreibt, bekommt gar keinen Neuaufbau - sonst
   verschwindet das Feld unter den Fingern und Getipptes waere weg. Der
   Neuaufbau wird nachgeholt, sobald das Feld verlassen wird. */
var lastRenderHash = null;
var renderPending = false;

function scrollHolder() {
  var el = document.getElementById('app-root'), l = [];
  while (el && el !== document.documentElement) {
    if (el.scrollHeight > el.clientHeight + 4) l.push([el, el.scrollTop]);
    el = el.parentElement;
  }
  var se = document.scrollingElement || document.documentElement;
  l.push([se, se.scrollTop]);
  return l;
}

function render() {
  var hashNow = location.hash;
  var gleicheSeite = (hashNow === lastRenderHash);

  var ae = document.activeElement;
  var tippt = ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.isContentEditable);
  if (gleicheSeite && tippt) {
    if (!renderPending) {
      renderPending = true;
      ae.addEventListener('blur', function () {
        renderPending = false;
        setTimeout(render, 0);
      }, { once: true });
    }
    return;
  }

  var halten = gleicheSeite ? scrollHolder() : null;
  var parsed = parseHash();
  var view = resolveView(parsed.parts, parsed.query);
  var root = document.getElementById('app-root');
  root.innerHTML = shellHtml(view.navKey, view.html);
  var main = qs('#main-content', root);
  if (view.afterRender) view.afterRender(main);
  lastRenderHash = hashNow;
  if (halten) {
    halten.forEach(function (x) { try { x[0].scrollTop = x[1]; } catch (e) {} });
  } else {
    window.scrollTo(0, 0);
  }
}

window.addEventListener('hashchange', render);

/* Globale Klick-/Tastatur-Delegation für [data-route]-Elemente
   (Sidebar, Karten, Buttons) — vermeidet Listener-Wirrwarr pro View. */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest && ev.target.closest('[data-route]');
  if (el) {
    ev.preventDefault();
    navigate(el.getAttribute('data-route'));
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var el = ev.target.closest && ev.target.closest('[data-route][role="button"]');
  if (el) {
    ev.preventDefault();
    navigate(el.getAttribute('data-route'));
  }
});

/* ---------------- Datenschutz-Hinweis (beim ersten Start) ---------------- */

function maybeShowPrivacyBanner() {
  var root = document.getElementById('banner-root');
  var dismissed = false;
  try { dismissed = !!localStorage.getItem(LS_PREFIX + 'banner_dismissed'); } catch (e) { /* Storage blockiert — Banner einfach zeigen */ }
  if (dismissed) return;
  root.innerHTML =
    '<div class="privacy-banner">' +
      '<div><strong>🔒 Keine Cloud, keine Telemetrie.</strong> Gespeichert wird in diesem Browser, verschlüsselt im Hub-Tresor und – falls verbunden – in der Team-Datei auf O:\\.</div>' +
      '<button type="button" id="banner-dismiss-btn">Verstanden</button>' +
    '</div>';
  qs('#banner-dismiss-btn', root).addEventListener('click', function () {
    try { localStorage.setItem(LS_PREFIX + 'banner_dismissed', '1'); } catch (e) {}
    root.innerHTML = '';
  });
}

/* Prüft beim Start, ob lokale Speicherung tatsächlich funktioniert.
   Wenn nicht (z. B. blockiert durch Browser-Einstellungen oder
   privates Fenster), wird ein deutlicher Warnhinweis gezeigt —
   sonst gingen Änderungen beim Schließen still verloren. */
function checkPersistenceAndWarn() {
  var ok = false;
  if (Storage.mode === 'indexeddb') {
    ok = true; // open() war erfolgreich — Schreibfehler melden die Views per Toast
  } else {
    try {
      localStorage.setItem(LS_PREFIX + '_write_test', '1');
      ok = localStorage.getItem(LS_PREFIX + '_write_test') === '1';
      localStorage.removeItem(LS_PREFIX + '_write_test');
    } catch (e) { ok = false; }
  }
  if (!ok) {
    var root = document.getElementById('banner-root');
    var warn = document.createElement('div');
    warn.className = 'privacy-banner';
    warn.style.background = '#f6e7e3';
    warn.style.borderColor = '#dcb4a8';
    warn.style.color = '#6e2a1a';
    warn.innerHTML = '<div><strong>Achtung: Lokale Speicherung ist in diesem Browser blockiert.</strong>' +
      'Einträge können erfasst, aber nicht dauerhaft gespeichert werden — beim Neuladen gehen Änderungen verloren. ' +
      'Bitte öffnen Sie die Datei in einem normalen Browserfenster (kein privater Modus) bzw. erlauben Sie Website-Daten für lokale Dateien.</div>';
    root.appendChild(warn);
  }
}

/* ---------------- Bootstrap ---------------- */

Repo.init()
  .then(function () {
    maybeShowPrivacyBanner();
    checkPersistenceAndWarn();
    render();
  })
  .catch(function (err) {
    document.getElementById('app-root').innerHTML =
      '<div class="empty-state">Fehler beim Initialisieren der lokalen Datenbank: ' + escapeHtml(err && err.message ? err.message : String(err)) +
      '<br>Bitte laden Sie die Seite neu. Falls das Problem bestehen bleibt, prüfen Sie, ob Ihr Browser IndexedDB / localStorage erlaubt.</div>';
  });

</script>
