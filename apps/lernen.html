/* Lern-App des CDSE – Design „Klar & präzise“ wie Hub und Toolbox */
:root {
  --bg: #f3f5f8;
  --bg-2: #e9edf2;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e2e6ec;
  --line-2: #cfd6e0;
  --ink: #0e1628;
  --ink-2: #263149;
  --muted: #586277;
  --faint: #8c96a8;
  --accent: #2e3a9c;
  --accent-strong: #232c7c;
  --accent-soft: #eceefa;
  --accent-line: #c8cdf0;
  --ok: #1e6b45;
  --ok-soft: #e3f4ea;
  --warn: #6b4a0c;
  --warn-soft: #fbf3e1;
  --err: #7a2a18;
  --err-soft: #fcedea;
  --gold: #c98a00;
  --radius-lg: 14px;
  --radius: 10px;
  --shadow-1: 0 1px 2px rgba(14, 22, 40, 0.05);
  --shadow-2: 0 1px 2px rgba(14, 22, 40, 0.04), 0 10px 28px -10px rgba(14, 22, 40, 0.16);
  --focus: 0 0 0 3px rgba(46, 58, 156, 0.26);
  --font-ui: 'Inter var', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-display: 'Manrope var', 'Inter var', system-ui, sans-serif;
  /* Bereiche */
  --b-grundlagen: #2e3a9c;
  --b-stoerungen: #a33b5b;
  --b-muster: #6e4a7e;
  --b-handeln: #1f6b6f;
  --b-system: #8a6414;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.disp { font-family: var(--font-display); font-weight: 780; letter-spacing: -0.02em; }

/* Kopf */
.kopf { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.kopf-innen { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; }
.marke { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marke-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; box-shadow: 0 6px 14px -6px var(--accent); }
.marke-ic svg { width: 19px; height: 19px; }
.marke b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.1; }
.marke span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 560; }
.reiter { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--bg-2); overflow-x: auto; max-width: 100%; }
.reiter button { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 13px; white-space: nowrap; }
.reiter button:hover { color: var(--ink); }
.reiter button[aria-current='page'] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
.reiter .n { font-size: 11.5px; font-weight: 700; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 1px 7px; }
.suche { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 220px; }
.suche svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
.suche input { border: 0; background: transparent; outline: none; width: 100%; font-size: 14px; }

main { max-width: 1280px; margin: 0 auto; padding: 26px 20px 80px; }
h1.seite { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.025em; margin: 0; line-height: 1.15; }
.unter { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
.abschnitt { margin-top: 30px; }
.abschnitt > h2 { font-family: var(--font-display); font-weight: 780; font-size: 19px; margin: 0 0 12px; letter-spacing: -0.015em; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 14px; border-radius: 10px; padding: 8px 14px; transition: background 0.15s, border-color 0.15s; }
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn svg { width: 16px; height: 16px; }
.btn-primaer { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primaer:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-leise { border-color: transparent; background: transparent; color: var(--accent); }
.btn-leise:hover { background: var(--accent-soft); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }

/* Karten */
.gitter { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.karte { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 16px 18px; transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; min-width: 0; }
a.karte, button.karte { text-align: left; color: inherit; text-decoration: none; }
a.karte:hover, button.karte:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
.karte h3 { font-family: var(--font-display); font-weight: 780; font-size: 17px; margin: 4px 0 4px; line-height: 1.25; letter-spacing: -0.01em; }
.karte p { margin: 0; color: var(--muted); font-size: 14px; }
.karte .fuss { margin-top: auto; padding-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.modul-karte::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--bc, var(--accent)); }
.status { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; font-size: 12px; border-radius: 999px; padding: 2px 9px; }
.status.neu { background: var(--bg-2); color: var(--muted); }
.status.begonnen { background: var(--accent-soft); color: var(--accent); }
.status.bestanden { background: var(--ok-soft); color: var(--ok); }
.status svg { width: 13px; height: 13px; }
.balken { height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.balken > span { display: block; height: 100%; background: var(--bc, var(--accent)); border-radius: 99px; }

/* Übersicht */
.start-kopf { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-top: 18px; }
.stand { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 112px; height: 112px; flex: 0 0 auto; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.zahlen { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; margin-top: 8px; }
.zahlen b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.zahlen span { font-size: 12.5px; color: var(--muted); }
.weiter-karte { background: linear-gradient(135deg, var(--accent), #3f4db8); color: #fff; border: 0; }
.weiter-karte p, .weiter-karte .eyebrow { color: rgba(255, 255, 255, 0.82); }
.weiter-karte h3 { color: #fff; }
.weiter-karte .btn { background: #fff; color: var(--accent); border-color: #fff; align-self: flex-start; margin-top: 12px; }

/* Modul */
.modul { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 34px; margin-top: 8px; }
.toc { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc button { display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 9px; padding: 7px 9px; font-size: 14px; color: var(--ink-2); }
.toc button:hover { background: var(--surface); }
.toc button[aria-current='true'] { background: var(--surface); box-shadow: var(--shadow-1), 0 0 0 1px var(--line); font-weight: 650; color: var(--ink); }
.toc .nr { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bg-2); color: var(--muted); font-size: 11.5px; font-weight: 700; flex: 0 0 auto; margin-top: 1px; }
.toc .nr.ok { background: var(--ok); color: #fff; }
.toc .nr svg { width: 12px; height: 12px; }
.modul-kopf { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px 24px; box-shadow: var(--shadow-1); position: relative; overflow: hidden; }
.modul-kopf::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--bc, var(--accent)); }
.modul-kopf h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.025em; margin: 6px 0 4px; line-height: 1.15; }
.modul-kopf .unter { font-size: 16px; }
.lernziele { margin-top: 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.lernziele h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.lernziele ul { margin: 0; padding-left: 20px; }
.lernziele li { margin: 3px 0; }
.lesen { max-width: 760px; }
.lesen h2.kap { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 34px 0 12px; }
.lesen p { margin: 0 0 14px; font-size: 16.5px; line-height: 1.7; color: var(--ink-2); }
.lesen strong { color: var(--ink); font-weight: 650; }
.begriff { text-decoration: underline dotted var(--accent-line); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: help; }
.box { border-radius: 12px; padding: 14px 18px; margin: 18px 0; font-size: 15.5px; line-height: 1.6; }
.box h3 { margin: 0 0 6px; font-size: 13px; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
.box h3 svg { width: 16px; height: 16px; }
.box p { font-size: 15.5px; margin: 0 0 8px; }
.box p:last-child { margin-bottom: 0; }
.box ul { margin: 0; padding-left: 20px; }
.box li { margin: 4px 0; }
.merke { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.merke h3 { color: var(--accent); }
.fall { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.fall h3 { color: var(--muted); }
.fall .fall-titel { font-family: var(--font-display); font-weight: 780; font-size: 17px; margin: 0 0 6px; }

.tun h3 { color: var(--ok); }
.tun ul, .lassen ul { list-style: none; padding: 0; }
.tun li, .lassen li { position: relative; padding-left: 26px; }
.tun li::before { content: ''; position: absolute; left: 2px; top: 6px; width: 14px; height: 8px; border-left: 2.5px solid var(--ok); border-bottom: 2.5px solid var(--ok); transform: rotate(-45deg); }
.lassen { background: var(--err-soft); }

.lassen li::before, .lassen li::after { content: ''; position: absolute; left: 4px; top: 11px; width: 14px; height: 2.5px; background: var(--err); transform: rotate(45deg); border-radius: 2px; }

.liste { background: var(--surface-2); border: 1px solid var(--line); }
.mythos { display: grid; grid-template-columns: 1fr 1fr; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.mythos > div { padding: 14px 18px; }
.mythos > div:first-child { background: var(--warn-soft); }
.mythos > div:first-child h3 { color: var(--warn); }
.mythos > div:last-child h3 { color: var(--ok); }
.abgrenzung { background: var(--surface); border: 1px solid var(--line); }
.abgrenzung dl { margin: 0; display: grid; gap: 10px; }
.abgrenzung dt { font-weight: 700; color: var(--ink); }
.abgrenzung dd { margin: 2px 0 0; color: var(--ink-2); }
.weiter { background: #eef5fb; border-left: 4px solid #2e6c9c; }
.weiter h3 { color: #2e6c9c; }
.achtung { background: #fbf1ec; border-left: 4px solid #b4533a; }
.achtung h3 { color: #8a3a24; }
.tabelle-wrap { overflow-x: auto; margin: 18px 0; border: 1px solid var(--line); border-radius: 12px; }
.tabelle-wrap table { border-collapse: collapse; width: 100%; font-size: 14.5px; background: var(--surface); }
.tabelle-wrap caption { text-align: left; font-weight: 700; padding: 10px 14px 0; }
.tabelle-wrap th { background: var(--surface-2); text-align: left; font-weight: 650; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.tabelle-wrap td { padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.kap-fuss { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 30px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
.modul-ende { margin-top: 36px; display: grid; gap: 14px; }
.quellen { font-size: 13px; color: var(--muted); }
.quellen li { margin: 4px 0; }
.notiz textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: var(--surface); line-height: 1.5; }

/* Quiz */
.quiz { max-width: 760px; margin: 0 auto; }
.quiz-kopf { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.quiz-karte { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-2); padding: 24px 26px; margin-top: 14px; }
.quiz-fall { background: var(--surface-2); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
.quiz-frage { font-family: var(--font-display); font-weight: 780; font-size: 20px; line-height: 1.35; margin: 0 0 14px; letter-spacing: -0.01em; }
.optionen { display: grid; gap: 8px; }
.option { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 15.5px; line-height: 1.45; }
.option:hover:not([disabled]) { border-color: var(--accent-line); background: var(--surface-2); }
.option .marker { display: grid; place-items: center; width: 22px; height: 22px; flex: 0 0 auto; border: 1.5px solid var(--line-2); border-radius: 50%; margin-top: 1px; font-size: 12px; font-weight: 700; color: var(--muted); }
.option.mehrfach .marker { border-radius: 6px; }
.option[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); }
.option[aria-pressed='true'] .marker { background: var(--accent); border-color: var(--accent); color: #fff; }
.option.richtig { border-color: var(--ok); background: var(--ok-soft); }
.option.richtig .marker { background: var(--ok); border-color: var(--ok); color: #fff; }
.option.falsch { border-color: #c0543f; background: var(--err-soft); }
.option.falsch .marker { background: #c0543f; border-color: #c0543f; color: #fff; }
.option[disabled] { cursor: default; }
.rueck { margin-top: 16px; border-radius: 12px; padding: 12px 16px; font-size: 15px; line-height: 1.55; }
.rueck.gut { background: var(--ok-soft); color: #174d33; }
.rueck.schlecht { background: var(--err-soft); color: #5c2213; }
.rueck b { display: block; margin-bottom: 3px; }
.quiz-fuss { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.ergebnis { text-align: center; padding: 30px 20px; }
.ergebnis .gross { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; margin: 10px 0; }
.ergebnis.gut .gross { color: var(--ok); }
.medaille { display: inline-grid; place-items: center; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe28a, #e0a526 60%, #b07d0b); box-shadow: 0 10px 24px -10px #b07d0b; color: #fff; }
.medaille svg { width: 34px; height: 34px; }

/* Glossar */
.glossar { display: grid; gap: 10px; }
.glossar dt { font-family: var(--font-display); font-weight: 780; font-size: 16px; }
.glossar dd { margin: 2px 0 0; color: var(--ink-2); }
.glossar .eintrag { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.glossar .eintrag button { margin-top: 6px; }
.buchstabe { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); margin: 18px 0 4px; }

/* Bestätigung (Druck) */
.urkunde { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 48px; max-width: 820px; margin: 20px auto; text-align: center; position: relative; }
.urkunde::before { content: ''; position: absolute; inset: 12px; border: 2px solid var(--accent-line); border-radius: 10px; pointer-events: none; }
.urkunde h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; margin: 10px 0; }
.urkunde table { margin: 18px auto 0; border-collapse: collapse; font-size: 14px; text-align: left; }
.urkunde td { padding: 5px 12px; border-top: 1px solid var(--line); }
.hinweis { background: var(--warn-soft); border: 1px solid #f0ddb2; color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.leer { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--surface); border: 1px dashed var(--line-2); border-radius: 14px; }

@media (max-width: 900px) {
  .modul { grid-template-columns: 1fr; }
  .toc { position: static; max-height: none; }
  .start-kopf { grid-template-columns: 1fr; }
  .mythos { grid-template-columns: 1fr; }
  .suche { margin-left: 0; width: 100%; }
}
@media print {
  .kopf, .keindruck { display: none !important; }
  body { background: #fff; }
  main { padding: 0; }
  .urkunde { border: 0; margin: 0 auto; }
}

/* ---------- Ergänzungen: Begriffe, Filter, Lernpfade, Wiederholen, Suche ---------- */
button.begriff { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; line-height: inherit; }
button.begriff:hover { text-decoration-color: var(--accent); }
.pop { position: absolute; z-index: 40; max-width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow-2); padding: 12px 14px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
.pop b { display: block; font-family: var(--font-display); font-size: 15.5px; color: var(--ink); margin-bottom: 3px; }
.pop .btn-leise { margin: 8px 0 0 -8px; padding: 4px 8px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 4px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .n { font-weight: 700; opacity: 0.7; margin-left: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; color: var(--muted); font-size: 13.5px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { width: 15px; height: 15px; }
.aktionen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.kap-kopf { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.kap-kopf a { font-family: var(--font-display); font-weight: 780; font-size: 17px; color: var(--ink); text-decoration: none; }
.kap-kopf a:hover { color: var(--accent); }
.kap-kopf span { color: var(--muted); font-size: 13.5px; }
.lesen .fall .fragen ul { margin: 4px 0 0; padding-left: 20px; }
.lesen .fall .fragen b { color: var(--ink-2); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.lesen .liste h3 { color: var(--muted); }
.lesen .abgrenzung h3 { color: var(--muted); }

.toc-fort { margin: 12px 9px 0; font-size: 12.5px; color: var(--muted); }
.toc-fort .balken { margin-top: 5px; }
.verweise { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.verweise a, .verweise button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; }
.verweise a:hover, .verweise button:hover { border-color: var(--line-2); background: var(--surface-2); }

.verweise small { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 12.5px; }
.quiz-hinweis { font-size: 13.5px; color: var(--muted); margin: -6px 0 12px; }
.aussage { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.quiz-kopf .balken { flex: 1; max-width: 240px; }
.quiz-kopf .eyebrow { color: var(--muted); }
.auswertung { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 8px; text-align: left; }
.auswertung li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }
.auswertung li > svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; }

.auswertung summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13.5px; }
.faecher { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.fach { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
.fach b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.fach span { font-size: 12px; color: var(--muted); }

.treffer .karte p mark { background: #fff1c2; color: inherit; border-radius: 3px; padding: 0 2px; }

.namensfeld input { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; min-width: 260px; }

@media (max-width: 700px) {
  .faecher { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .urkunde { box-shadow: none; }
}

.glossar { grid-template-columns: minmax(0, 1fr); }
.glossar .eintrag, .karte, .box, .quiz-karte, .lesen { min-width: 0; overflow-wrap: break-word; }
.glossar dt, .glossar dd { overflow-wrap: anywhere; }

a.btn, a.btn:hover { text-decoration: none; }
[tabindex='-1']:focus { outline: none; box-shadow: none; }
@media (max-width: 900px) {

}

  .reiter button { padding: 6px 10px; font-size: 13.5px; }
  .kopf-innen { padding: 8px 12px; }
  main { padding: 20px 14px 60px; }
}

    var h = '<div class="aktionen keindruck" style="justify-content:center;margin-top:0"><a class="btn btn-leise" href="#/pfad/' + id + '">' + svg('links') + 'Zurück</a><button type="button" class="btn btn-primaer" data-aktion="drucken">' + svg('druck') + 'Drucken oder als PDF speichern</button></div>' +
      (name ? '' : '<div class="namensfeld keindruck"><label for="urkunde-name">Name für die Bestätigung</label><input id="urkunde-name" value="' + esc(ST.name || '') + '" autocomplete="name"></div>') +
      '<div class="urkunde"><p class="eyebrow">CDSE · Lernen</p><h1>Teilnahmebestätigung</h1><p class="text"><b id="urkunde-wer">' + esc(name || '…') + '</b> hat den Lernpfad <b>„' + esc(p.name) + '“</b> vollständig bearbeitet und die Abschlussquizze aller Module bestanden (jeweils mindestens 80 %).</p>' +
      '<table><thead><tr><th style="text-align:left;padding:5px 12px">Modul</th><th style="text-align:left;padding:5px 12px">bestanden am</th><th style="text-align:left;padding:5px 12px">Ergebnis</th></tr></thead><tbody>' + s.ids.map(function (mid) {
        var z = ST.module[mid] || {};
        return '<tr><td>' + esc(MOD[mid].titel) + '</td><td>' + datumDe(z.bestanden) + '</td><td>' + (besterWert(mid) || '') + ' %</td></tr>';
      }).join('') + '</tbody></table>' +
      '<div class="unterschrift"><div>Ausgestellt am ' + datumDe(heute()) + '</div><div>Unterschrift (Leitung)</div></div>' +
      '<p class="klein">Selbstlernangebot des CDSE mit Wissensüberprüfung. Keine zertifizierte Fort- oder Weiterbildung.</p></div>';
    zeigen(h);
  }

  /* =====================================================================
     Suche
     ===================================================================== */
  var SUCHTEXT = null;
  function suchtextBauen() {
    SUCHTEXT = [];
    MODULE.forEach(function (m) {
      m.kapitel.forEach(function (k, i) {
        var teile = [];
        k.bloecke.forEach(function (b) {
          ['text', 'titel', 'mythos', 'fakt'].forEach(function (f) { if (b[f]) { teile.push(klartext(b[f])); } });
          (b.punkte || []).forEach(function (p) { teile.push(typeof p === 'string' ? klartext(p) : klartext(p.wie + ' – ' + p.unterschied)); });
          (b.fragen || []).forEach(function (p) { teile.push(klartext(p)); });
          if (b.zeilen) { b.zeilen.forEach(function (z) { teile.push(z.map(klartext).join(' · ')); }); }
        });
        var t = teile.join(' ');
        SUCHTEXT.push({ m: m, k: i + 1, titel: k.titel, text: t, n: norm(t) });
      });
    });
  }
  function ausschnitt(t, n, q) {
    var i = n.indexOf(q);
    if (i < 0) { return esc(t.slice(0, 160)) + '…'; }
    // Treffer von n (normalisiert) auf t (Original) umrechnen: norm() macht aus „ß“ zwei Zeichen („ss“)
    var von = 0, bis = t.length, l = 0;
    for (var j = 0; j < t.length && l < i + q.length; j++) {
      l += t.charCodeAt(j) < 128 ? 1 : norm(t.charAt(j)).length;   // ASCII bleibt ein Zeichen
      if (l <= i) { von = j + 1; }
      bis = j + 1;
    }
    var a = Math.max(0, von - 70), b = Math.min(t.length, bis + 110);
    return (a ? '…' : '') + esc(t.slice(a, von)) + '<mark>' + esc(t.slice(von, bis)) + '</mark>' + esc(t.slice(bis, b)) + (b < t.length ? '…' : '');
  }
  function seiteSuche(q) {
    var such = (q.q || '').trim(), n = norm(such);
    if (!SUCHTEXT) { suchtextBauen(); }
    var h = '<h1 class="seite">Suche</h1>';
    if (n.length < 2) { zeigen(h + '<p class="unter">Mindestens zwei Buchstaben eingeben.</p>'); return; }
    var mods = MODULE.filter(function (m) { return norm(m.titel + ' ' + m.untertitel + ' ' + m.lernziele.join(' ')).indexOf(n) >= 0; });
    var kaps = SUCHTEXT.filter(function (s) { return s.n.indexOf(n) >= 0 || norm(s.titel).indexOf(n) >= 0; }).slice(0, 30);
    var begr = GLOSSAR.filter(function (g) { return norm(g.begriff).indexOf(n) >= 0; }).slice(0, 12);
    h += '<p class="unter">„' + esc(such) + '“: ' + woerter(mods.length, 'Modul', 'Module') + ', ' + woerter(kaps.length, 'Kapitel', 'Kapitel') + ', ' + woerter(begr.length, 'Begriff', 'Begriffe') + '.</p>';
    if (mods.length) { h += '<section class="abschnitt"><h2>Module</h2><div class="gitter">' + mods.map(modulKarte).join('') + '</div></section>'; }
    if (begr.length) {
      h += '<section class="abschnitt"><h2>Fachbegriffe</h2><dl class="glossar">' + begr.map(function (g) {
        return '<div class="eintrag"><dt>' + esc(g.begriff) + '</dt><dd>' + inline(g.erklaerung) + '</dd></div>';
      }).join('') + '</dl></section>';
    }
    if (kaps.length) {
      h += '<section class="abschnitt"><h2>In den Kapiteln</h2><div class="treffer">' + kaps.map(function (s) {
        return '<a class="karte" href="#/modul/' + s.m.id + '/' + s.k + '"><span class="eyebrow" style="color:var(--b-' + s.m.bereich + ')">' + esc(s.m.titel) + ' · Kapitel ' + s.k + '</span><h3>' + esc(s.titel) + '</h3><p>' + ausschnitt(s.text, s.n, n) + '</p></a>';
      }).join('') + '</div></section>';
    }
    if (!mods.length && !kaps.length && !begr.length) { h += '<div class="leer" style="margin-top:18px">Nichts gefunden. Versuchen Sie ein anderes Wort.</div>'; }
    zeigen(h, false);
  }

  function seiteFehlt() {
    zeigen('<h1 class="seite">Nicht gefunden</h1><p class="unter">Dieses Modul oder diese Seite gibt es (nicht mehr).</p><div class="aktionen"><a class="btn btn-primaer" href="#/">Zur Übersicht</a></div>');
  }

  /* =====================================================================
     Router und Ereignisse
     ===================================================================== */
  function query(s) {
    var o = {};
    (s || '').split('&').forEach(function (p) { if (!p) { return; } var i = p.indexOf('='); o[decodeURIComponent(i < 0 ? p : p.slice(0, i))] = i < 0 ? '' : decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' ')); });
    return o;
  }
  function route() {
    var h = location.hash.replace(/^#\/?/, ''), qi = h.indexOf('?'), pfad = qi < 0 ? h : h.slice(0, qi), q = query(qi < 0 ? '' : h.slice(qi + 1));
    var t = pfad.split('/').filter(Boolean).map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
    var seite = t[0] || '';
    if (seite !== 'quiz' && QZ && QZ.modus === 'quiz') { QZ = null; }
    if (seite !== 'wiederholen' && QZ && QZ.modus === 'wdh') { QZ = null; }
    if (seite !== 'suche') { var si = document.getElementById('suche'); if (si && si.value) { si.value = ''; } }
    reiterNeu(seite);
    switch (seite) {
      case '': seiteUebersicht(); break;
      case 'module': seiteModule(q); break;
      case 'modul': seiteModul(t[1], t[2]); break;
      case 'quiz': seiteQuiz(t[1]); break;
      case 'wiederholen': seiteWiederholen(); break;
      case 'glossar': seiteGlossar(q); break;
      case 'pfad': seitePfad(t[1]); break;
      case 'bestaetigung': seiteBestaetigung(t[1]); break;
      case 'suche': seiteSuche(q); break;
      default: seiteFehlt();
    }
  }
  function geh(ziel) { if (location.hash === ziel) { route(); } else { location.hash = ziel; } }

  function ereignisse() {
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest ? ev.target.closest('button, a') : null;
      if (pop && (!t || !pop.contains(t)) && !(t && t.classList.contains('begriff'))) { popZu(); }
      if (!t) { return; }
      if (t.classList.contains('begriff')) { ev.preventDefault(); if (pop && pop.__knopf === t) { popZu(); } else { popAuf(t); } return; }
      if (t.hasAttribute('data-gelesen')) {
        var m = location.hash.match(/^#\/modul\/([^/]+)/);
        if (m && MOD[decodeURIComponent(m[1])]) { var z = mz(decodeURIComponent(m[1])), k = +t.getAttribute('data-gelesen'); if (z.gelesen.indexOf(k) < 0) { z.gelesen.push(k); z.gelesen.sort(function (a, b) { return a - b; }); stSpeichern(); } }
      }
      if (t.hasAttribute('data-geh')) { ev.preventDefault(); popZu(); geh(t.getAttribute('data-geh')); return; }
      if (t.hasAttribute('data-filter')) {
        filter[t.getAttribute('data-filter')] = t.getAttribute('data-wert');
        var fokus = t.getAttribute('data-filter') + '|' + t.getAttribute('data-wert');
        seiteModule({});
        var b = el.querySelector('[data-filter="' + fokus.split('|')[0] + '"][data-wert="' + fokus.split('|')[1] + '"]');
        if (b) { b.focus(); }
        return;
      }
      if (t.hasAttribute('data-option') && QZ && !QZ.geprueft) {
        var j = +t.getAttribute('data-option'), x = QZ.fragen[QZ.pos];
        if (x.f.art === 'mehrfach') { var i = QZ.wahl.indexOf(j); if (i >= 0) { QZ.wahl.splice(i, 1); } else { QZ.wahl.push(j); } }
        else { QZ.wahl = [j]; }
        Array.prototype.forEach.call(el.querySelectorAll('[data-option]'), function (o) { o.setAttribute('aria-pressed', String(QZ.wahl.indexOf(+o.getAttribute('data-option')) >= 0)); });
        var p = el.querySelector('[data-quiz="pruefen"]'); if (p) { p.disabled = !QZ.wahl.length; }
        return;
      }
      var q = t.getAttribute('data-quiz');
      if (q === 'pruefen' && QZ && QZ.wahl.length) { quizPruefen(); return; }
      if (q === 'weiter' && QZ) { quizWeiter(); return; }
      if (q === 'neu') { var mm = location.hash.match(/^#\/quiz\/([^/?]+)/); if (mm && MOD[decodeURIComponent(mm[1])]) { quizStarten(MOD[decodeURIComponent(mm[1])]); quizZeigen(); } return; }
      if (t.getAttribute('data-wdh') === 'start') { wiederholungStarten(); if (QZ.fragen.length) { if (location.hash !== '#/wiederholen') { location.hash = '#/wiederholen'; } else { quizZeigen(); } } return; }
      var a = t.getAttribute('data-aktion');
      if (a === 'drucken') { window.print(); return; }
      if (a === 'zuruecksetzen') {
        if (window.confirm('Den ganzen Lernstand löschen – gelesene Kapitel, Quizergebnisse, Lernkartei und Notizen? Das lässt sich nicht rückgängig machen.')) {
          ST = { v: 1, module: {}, karten: {}, zuletzt: null, name: '' }; stSpeichern(); geh('#/');
        }
      }
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && pop) { var k = pop.__knopf; popZu(); if (k) { k.focus(); } return; }
      if (!QZ || !el.querySelector('.quiz-karte') || /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target && ev.target.tagName) || '')) { return; }
      if (ev.altKey || ev.ctrlKey || ev.metaKey) { return; }
      var z = /^[1-6]$/.test(ev.key) ? +ev.key - 1 : (/^[a-fA-F]$/.test(ev.key) ? ev.key.toLowerCase().charCodeAt(0) - 97 : -1);
      if (z >= 0 && !QZ.geprueft) { var o = el.querySelectorAll('[data-option]')[z]; if (o) { ev.preventDefault(); o.click(); o.focus(); } return; }
      if (ev.key === 'Enter' && !(ev.target && ev.target.closest && ev.target.closest('button[data-quiz], a'))) {
        var b = el.querySelector(QZ.geprueft ? '[data-quiz="weiter"]' : '[data-quiz="pruefen"]:not([disabled])');
        if (b) { ev.preventDefault(); b.click(); }
      }
    });
    var suchTimer = null;
    document.addEventListener('input', function (ev) {
      var t = ev.target;
      if (t.id === 'suche') {
        clearTimeout(suchTimer);
        suchTimer = setTimeout(function () {
          var v = t.value.trim();
          if (!v) { if (/^#\/suche/.test(location.hash)) { history.back(); } return; }
          var ziel = '#/suche?q=' + encodeURIComponent(v);
          if (/^#\/suche/.test(location.hash)) { history.replaceState(null, '', ziel); seiteSuche({ q: v }); } else { location.hash = ziel; }
          t.focus();
        }, 180);
      }
      if (t.id === 'glossar-suche') {
        var n = norm(t.value);
        document.getElementById('glossar-liste').innerHTML = glossarListe(GLOSSAR.filter(function (g) { return !n || norm(g.begriff).indexOf(n) >= 0 || norm(g.erklaerung).indexOf(n) >= 0; }));
      }
      if (t.hasAttribute('data-notiz')) { mz(t.getAttribute('data-notiz')).notiz = t.value; clearTimeout(t.__timer); t.__timer = setTimeout(stSpeichern, 400); }
      if (t.id === 'urkunde-name') { ST.name = t.value; var w = document.getElementById('urkunde-wer'); if (w) { w.textContent = t.value || '…'; } clearTimeout(t.__timer); t.__timer = setTimeout(stSpeichern, 400); }
    });
    window.addEventListener('hashchange', route);
    window.addEventListener('resize', popZu);
    /* Lernstand aus einem anderen Fenster (z. B. zweiter Tab) übernehmen */
    window.addEventListener('storage', function (ev) { if (ev.key === LS) { ST = stLaden(); if (!QZ) { route(); } } });
  }

  /* =====================================================================
     Start: eingebettete Module entpacken
     ===================================================================== */
  function entpacken() {
    var roh = document.getElementById('lern-daten');
    var b64 = roh ? roh.textContent.trim() : '';
    if (!b64) { return Promise.resolve(window.LERN_MODULE || []); }
    if (typeof DecompressionStream === 'undefined') { return Promise.reject(new Error('Dieser Browser kann die eingebetteten Module nicht entpacken. Bitte Edge oder Chrome in einer aktuellen Version benutzen.')); }
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse);
  }
  function start() {
    el = document.getElementById('app');
    ST = stLaden();
    entpacken().then(function (liste) {
      MODULE = (liste || []).filter(function (m) { return m && m.id && Array.isArray(m.kapitel) && Array.isArray(m.quiz); });
      var reihe = BEREICHE.map(function (b) { return b.id; });
      MODULE.sort(function (a, b) { return (reihe.indexOf(a.bereich) - reihe.indexOf(b.bereich)) || ((a.reihe || 99) - (b.reihe || 99)) || a.titel.localeCompare(b.titel, 'de'); });
      MODULE.forEach(function (m) { MOD[m.id] = m; });
      glossarBauen();
      ereignisse();
      route();
    }).catch(function (e) {
      el.innerHTML = '<div class="leer"><b>Die Lernmodule ließen sich nicht laden.</b><br>' + esc(e && e.message || e) + '</div>';
    });
  }
  window.CDSE_LERNEN = { stand: function () { return JSON.parse(JSON.stringify(ST)); }, module: function () { return MODULE.map(function (m) { return m.id; }); } };
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', start); } else { start(); }
})();
